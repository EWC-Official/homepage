<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>EWC 雨雲・雷・長予報・線状降水帯レーダー</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Noto+Sans+JP:wght@400;700;900&display=swap');

        body, html { 
            margin: 0; padding: 0; height: 100%; overflow: hidden; 
            background-color: #f1f5f9; 
            font-family: 'Inter', 'Noto Sans JP', sans-serif;
        }
        #map { width: 100%; height: 100%; z-index: 0; }
        
        .leaflet-container img.leaflet-tile {
            max-width: none !important;
            max-height: none !important;
        }

        .radar-tiles {
            image-rendering: auto !important;
            mix-blend-mode: multiply;
            transition: opacity 0.2s linear;
        }

        .safe-top { padding-top: calc(env(safe-area-inset-top) + 0.5rem); }
        .pb-safe { padding-bottom: calc(env(safe-area-inset-bottom) + 1rem); }
        
        @media (min-width: 768px) {
            .pb-safe { padding-bottom: 1.25rem; }
        }

        /* カスタムスライダーの透明化（上に被せて操作用にする） */
        input[type=range] {
            -webkit-appearance: none;
            background: transparent;
        }
        input[type=range]:focus { outline: none; }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 30px; width: 30px;
            background: transparent;
            cursor: pointer;
            margin-top: -12px;
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%; height: 6px;
            background: transparent;
        }
    </style>
</head>
<body class="relative flex flex-col">

    <div id="map" class="flex-grow cursor-crosshair"></div>

    <!-- メイン操作UI (上部) -->
    <div class="absolute top-0 left-0 w-full z-[1000] p-2 flex flex-col gap-2 pointer-events-none safe-top">
        <div class="flex justify-between items-start px-1">
            <div class="bg-white/95 backdrop-blur-sm px-4 py-2 rounded-full shadow-lg border border-slate-200 inline-flex items-center gap-2 pointer-events-auto h-9">
                <div id="title-dot" class="w-2.5 h-2.5 bg-blue-600 rounded-full animate-pulse shadow-[0_0_8px_rgba(37,99,235,0.6)]"></div>
                <h1 id="app-title" class="text-slate-900 font-black text-xs tracking-tighter italic">EWC 雨雲レーダー</h1>
            </div>

            <div class="flex gap-2 pointer-events-auto items-start">
                <div class="bg-white/95 backdrop-blur-sm p-1 rounded-xl shadow-lg border border-slate-200 flex items-center gap-1 h-9">
                    <button id="mode-rain" class="px-3 py-1.5 text-[10px] font-bold rounded-lg bg-blue-600 text-white shadow-md shadow-blue-200 transition-all h-full flex items-center">雨雲</button>
                    <button id="mode-thunder" class="px-3 py-1.5 text-[10px] font-bold rounded-lg text-slate-500 hover:bg-slate-100 transition-all h-full flex items-center">雷</button>
                    <button id="mode-senjo" class="px-3 py-1.5 text-[10px] font-bold rounded-lg text-slate-500 hover:bg-slate-100 transition-all h-full flex items-center">線状降水帯</button>
                </div>

                <!-- ズームボタン -->
                <div class="flex flex-col items-end gap-1.5">
                    <div class="flex gap-1">
                        <button id="zoom-in" class="w-9 h-9 bg-white/95 backdrop-blur-sm rounded-xl shadow-lg border border-slate-200 flex items-center justify-center text-slate-700 active:scale-90 pointer-events-auto">
                            <i class="fas fa-plus text-sm"></i>
                        </button>
                        <button id="zoom-out" class="w-9 h-9 bg-white/95 backdrop-blur-sm rounded-xl shadow-lg border border-slate-200 flex items-center justify-center text-slate-700 active:scale-90 pointer-events-auto">
                            <i class="fas fa-minus text-sm"></i>

                    </div>
                </div>

        </div>

        <div class="flex justify-center mt-2 pointer-events-none">

        </div>

    <!-- 統合パネル (グラフ ＋ スライダー) -->
    <div id="integrated-panel" class="fixed z-[1500] bg-white/95 backdrop-blur-md px-5 md:px-6 pt-5 pb-safe flex flex-col bottom-0 left-0 w-full md:w-[460px] md:bottom-4 md:left-4 md:rounded-3xl shadow-2xl border border-slate-200 pointer-events-auto transition-all duration-300">
        
        <!-- グラフセクション -->
        <div id="graph-section" class="hidden flex-col border-b border-slate-100 pb-4 mb-4">
            <div class="flex items-center justify-between mb-2">
                <div class="flex items-center gap-2">
                    <div class="w-2.5 h-2.5 bg-blue-600 rounded-full animate-pulse shadow-[0_0_8px_rgba(37,99,235,0.4)]"></div>

            <div id="chart-container" class="relative w-full h-40 bg-white rounded-xl overflow-hidden flex items-center justify-center">

        <!-- スライダー＆コントロールセクション -->

            <div class="flex justify-between items-center mb-3">

                    <div id="status-badge"></div>
                </div>
                
                <div class="flex items-center gap-2">
                    <button id="play-btn" class="w-10 h-10 md:w-11 md:h-11 bg-blue-600 hover:bg-blue-700 text-white rounded-full flex items-center justify-center transition-colors shadow-[0_4px_12px_rgba(37,99,235,0.3)] flex-shrink-0 active:scale-95">
                        <i id="play-icon" class="fas fa-play text-sm"></i>

                    <div class="flex bg-slate-50 rounded-full overflow-hidden border border-slate-200">

                            <i class="fas fa-backward-step text-sm"></i>
                        </button>
                        <button id="next-btn" class="w-10 h-10 md:w-11 md:h-11 hover:bg-slate-200 flex items-center justify-center transition-colors text-slate-600 flex-shrink-0 active:bg-slate-300">

            <!-- スライダーバー -->
            <div class="relative w-full h-[5px] bg-slate-200 rounded-full mt-2">
                <div id="slider-progress" class="absolute left-0 top-0 h-full bg-blue-500 rounded-full pointer-events-none transition-all duration-75" style="width: 0%;"></div>
                <input type="range" id="time-slider" min="0" max="0" value="0" class="absolute w-full h-full opacity-0 cursor-pointer z-10 m-0" style="height: 24px; top: -9.5px;">
            </div>

            <div class="relative w-full h-4 mt-2 text-[10px] font-bold text-slate-400">
                <span class="absolute left-0">3時間前</span>
                <span id="now-label" class="absolute transform -translate-x-1/2" style="left: 50%;">現在</span>
                <span id="end-label" class="absolute right-0">15時間後</span>
            </div>
        </div>
    </div>

    <!-- 凡例 (雨雲) -->
    <div id="legend-rain" class="absolute right-3 top-36 md:top-40 z-[1000] bg-white/95 backdrop-blur-sm p-2 rounded-2xl shadow-xl border border-slate-200 flex flex-col gap-1 text-[9px] font-bold text-slate-600 transition-opacity">
        <div class="text-center border-b border-slate-100 mb-1.5 pb-1.5 opacity-40 text-[8px] tracking-tighter">雨量 (mm/h)</div>
        <div class="flex items-center gap-2"><div class="w-3.5 h-3.5 bg-[#b40068] rounded shadow-sm"></div><span>80+</span></div>
        <div class="flex items-center gap-2"><div class="w-3.5 h-3.5 bg-[#ff2800] rounded shadow-sm"></div><span>50</span></div>
        <div class="flex items-center gap-2"><div class="w-3.5 h-3.5 bg-[#ff9900] rounded shadow-sm"></div><span>30</span></div>
        <div class="flex items-center gap-2"><div class="w-3.5 h-3.5 bg-[#faf500] rounded shadow-sm"></div><span>20</span></div>
        <div class="flex items-center gap-2"><div class="w-3.5 h-3.5 bg-[#0041ff] rounded shadow-sm"></div><span>10</span></div>
        <div class="flex items-center gap-2"><div class="w-3.5 h-3.5 bg-[#218cff] rounded shadow-sm"></div><span>5</span></div>
        <div class="flex items-center gap-2"><div class="w-3.5 h-3.5 bg-[#a0d2ff] rounded shadow-sm"></div><span>1</span></div>
        <div class="flex items-center gap-2"><div class="w-3.5 h-3.5 bg-[#f2f2ff] border border-slate-200 rounded shadow-sm"></div><span>0.1</span></div>
    </div>

    <!-- 凡例 (線状降水帯) -->
    <div id="legend-senjo" class="absolute right-3 top-36 md:top-40 z-[1000] bg-white/95 backdrop-blur-sm p-3 rounded-2xl shadow-xl border border-slate-200 flex flex-col gap-1.5 text-[9px] font-bold text-slate-600 opacity-0 pointer-events-none transition-opacity max-w-[150px]">
        <div class="text-center border-b border-slate-100 mb-1 pb-1 opacity-40 text-[8px] tracking-tighter">線状降水帯情報</div>
        <div class="flex items-start gap-2">
            <div class="w-4 h-4 bg-[#ff2800] rounded shadow-sm flex-shrink-0 mt-0.5"></div>
            <span class="leading-tight text-slate-700 text-[9px]">今後３時間以内に線状降水帯による​大雨のおそれのある領域</span>
        </div>
    </div>

    <script>
        // --- 画像ロード用汎用フォールバック関数 ---
        function loadImageWithFallback(primaryUrl, fallbackUrl) {
            return new Promise((resolve, reject) => {
                const img = new Image();
                img.crossOrigin = "Anonymous";
                img.onload = () => resolve(img);
                img.onerror = () => {
                    if (fallbackUrl) {
                        const fallbackImg = new Image();
                        fallbackImg.crossOrigin = "Anonymous";
                        fallbackImg.onload = () => resolve(fallbackImg);
                        fallbackImg.onerror = () => reject(new Error("Both URLs failed"));
                        fallbackImg.src = fallbackUrl;
                    } else {
                        reject(new Error("Primary URL failed"));
                    }
                };
                img.src = primaryUrl;
            });
        }

        document.addEventListener('DOMContentLoaded', () => {
            const map = L.map('map', {
                minZoom: 4, maxZoom: 18, zoomControl: false, zoomDelta: 1, zoomSnap: 1
            }).setView([37.5, 137.5], 5);

            L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/pale/{z}/{x}/{y}.png', {
                maxZoom: 18, attribution: "&copy; GSI Japan"
            }).addTo(map);

            map.createPane('radarPane');
            map.getPane('radarPane').style.zIndex = 450; 
            map.getPane('radarPane').style.pointerEvents = 'none'; 

            // --- Leaflet カスタム TileLayer (immed / none 自動リトライ機能付き) ---
            L.TileLayer.FallbackRadar = L.TileLayer.extend({
                createTile: function(coords, done) {
                    const tile = document.createElement('img');
                    L.DomEvent.on(tile, 'load', L.Util.bind(this._tileOnLoad, this, done, tile));
                    L.DomEvent.on(tile, 'error', L.Util.bind(this._tileOnErrorFallback, this, done, tile));

                    if (this.options.crossOrigin || this.options.crossOrigin === '') {
                        tile.crossOrigin = this.options.crossOrigin === true ? '' : this.options.crossOrigin;
                    }

                    tile.alt = '';
                    tile.setAttribute('role', 'presentation');

                    const url = this.getTileUrl(coords);
                    tile.src = url;

                    // 代替用のURLをあらかじめ計算（線状降水帯モード時は /none/ 固定のためフォールバックしない）
                    if (this.options.folder === 'rasrf' && this.options.activeMode !== 'sjfcstmap') {
                        let fallbackUrl = '';
                        if (url.includes('/immed/')) {
                            fallbackUrl = url.replace('/immed/', '/none/');
                        } else if (url.includes('/none/')) {
                            fallbackUrl = url.replace('/none/', '/immed/');
                        }
                        tile._fallbackUrl = fallbackUrl;
                        tile._hasTriedFallback = false;
                    }

                    return tile;
                },
                _tileOnErrorFallback: function(done, tile, e) {
                    if (tile._fallbackUrl && !tile._hasTriedFallback) {
                        tile._hasTriedFallback = true;
                        tile.src = tile._fallbackUrl;
                    } else {
                        // 両方失敗した場合は1x1透明ピクセルを返す
                        tile.src = this.options.errorTileUrl || 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=';
                        L.TileLayer.prototype._tileOnError.call(this, done, tile, e);
                    }
                }
            });

            L.tileLayer.fallbackRadar = function(url, options) {
                return new L.TileLayer.FallbackRadar(url, options);
            };

            let timeData = []; 
            let senjoTimeData = []; // 線状降水帯用のタイムライン配列
            let currentRealtimeIndex = 0;
            let playInterval = null;
            let currentLayerMode = 'hrpns'; // デフォルト: 雨雲ナウキャスト
            let lastInformedKey = "";
            let analysisSessionId = 0; 
            let currentChartInstance = null;
            let clickMarker = null; 
            const tileCache = {};

            const timeDisplay = document.getElementById('time-display');
            const statusBadge = document.getElementById('status-badge');
            const playBtn = document.getElementById('play-btn');
            const playIcon = document.getElementById('play-icon');
            const dataTip = document.getElementById('data-tip');
            const graphSection = document.getElementById('graph-section');
            const chartContainer = document.getElementById('chart-container');
            const sliderInput = document.getElementById('time-slider');
            const sliderProgress = document.getElementById('slider-progress');
            const nowLabel = document.getElementById('now-label');
            const prevBtn = document.getElementById('prev-btn');
            const nextBtn = document.getElementById('next-btn');

            // --- グラフ・UI処理 ---
            function getRankFromValue(val, mode) {
                if (val === 0) return 0;
                if (mode === 'hrpns' || mode === 'rasrf') {
                    if (val >= 80) return 8; if (val >= 50) return 7; if (val >= 30) return 6;
                    if (val >= 20) return 5; if (val >= 10) return 4; if (val >= 5) return 3;
                    if (val >= 1) return 2;
                    return 1; 
                } else {
                    if (val >= 4) return 4; if (val >= 3) return 3; if (val >= 2) return 2; if (val >= 1) return 1; return 0;
                }
            }

            function getLabelFromRank(rank, mode) {
                if (rank === 0) return '0';
                if (mode === 'hrpns' || mode === 'rasrf') {
                    const labels = ['0', '0.1', '1', '5', '10', '20', '30', '50', '80'];
                    return labels[rank] || '';
                } else {
                    const labels = ['0', '1', '2', '3', '4'];
                    return labels[rank] || '';
                }
            }

            const chartHighlightPlugin = {
                id: 'chartHighlight',
                beforeDatasetsDraw: (chart) => {
                    const activeIdx = parseInt(sliderInput.value);
                    if (activeIdx < 0 || isNaN(activeIdx)) return;
                    const ctx = chart.ctx;
                    const xAxis = chart.scales.x;
                    const yAxis = chart.scales.y;
                    const xPos = xAxis.getPixelForValue(chart.data.labels[activeIdx]);
                    if (!xPos) return;
                    const count = chart.data.labels.length;
                    const barWidth = (xAxis.right - xAxis.left) / count;
                    ctx.save();
                    ctx.fillStyle = 'rgba(37, 99, 235, 0.12)'; 
                    ctx.fillRect(xPos - barWidth/2, yAxis.top, barWidth, yAxis.bottom - yAxis.top);
                    ctx.restore();
                },
                afterDraw: (chart) => {
                    if (currentRealtimeIndex < 0 || currentLayerMode === 'sjfcstmap') return;
                    const ctx = chart.ctx;
                    const xAxis = chart.scales.x;
                    const yAxis = chart.scales.y;
                    const xPos = xAxis.getPixelForValue(chart.data.labels[currentRealtimeIndex]);
                    if (xPos === undefined || isNaN(xPos)) return;
                    ctx.save();
                    ctx.beginPath();
                    ctx.strokeStyle = '#ef4444'; ctx.lineWidth = 1.5; ctx.setLineDash([4, 2]);
                    ctx.moveTo(xPos, yAxis.top); ctx.lineTo(xPos, yAxis.bottom);
                    ctx.stroke();
                    ctx.fillStyle = '#ef4444'; ctx.font = '900 10px Inter'; ctx.textAlign = 'center';
                    ctx.fillText('実況', xPos, yAxis.top - 6);
                    ctx.restore();
                }
            };

            document.getElementById('zoom-in').onclick = (e) => { e.stopPropagation(); map.zoomIn(); };
            document.getElementById('zoom-out').onclick = (e) => { e.stopPropagation(); map.zoomOut(); };
            
            document.getElementById('close-analysis').onclick = () => {
                graphSection.classList.add('hidden');
                graphSection.classList.remove('flex');
                if (clickMarker) { map.removeLayer(clickMarker); clickMarker = null; }
            };

            function parseJmaTime(timeStr) {
                return new Date(Date.UTC(
                    parseInt(timeStr.substring(0, 4)), parseInt(timeStr.substring(4, 6)) - 1,
                    parseInt(timeStr.substring(6, 8)), parseInt(timeStr.substring(8, 10)),
                    parseInt(timeStr.substring(10, 12))
                ));
            }

            function formatTimeCustom(timeStr) {
                const date = parseJmaTime(timeStr);
                const days = ['日', '月', '火', '水', '木', '金', '土'];
                const d = date.getDate();
                const day = days[date.getDay()];
                const h = String(date.getHours()).padStart(2, '0');
                const m = String(date.getMinutes()).padStart(2, '0');
                return `${d}日(${day}) ${h}:${m}`;
            }

            // ズームレベル、表示モードに応じた最適なNativeZoomの算出
            function getValidEvenZoom(zoom, mode) {
                let maxLimit = 10;
                if (mode === 'rasrf' || mode === 'sjfcstmap') maxLimit = 8; // 長予報・線状降水帯はZ8まで配信
                else if (mode === 'thns') maxLimit = 8; // 雷はZ8まで
                
                if (zoom < 4) return 4;
                if (zoom >= maxLimit) return maxLimit;
                return Math.floor(zoom / 2) * 2;
            }

            function findEffectiveTime(index, mode) {
                if (mode === 'thns') {
                    const min = parseInt(timeData[index].validtime.substring(10, 12));
                    const roundedMin = Math.floor(min / 10) * 10;
                    const roundedTime = timeData[index].validtime.substring(0, 10) + String(roundedMin).padStart(2, '0') + "00";
                    const found = timeData.find(t => t.validtime === roundedTime);
                    if (found) return found;
                }
                return timeData[index];
            }

            // 予報の「分」に連動した正しい basetime（配信発表時刻）を正確に逆算
            function calculateRasrfBasetime(validtimeStr, rDate) {
                const vDate = parseJmaTime(validtimeStr);
                const vMin = vDate.getUTCMinutes();
                
                const baseDate = new Date(rDate.getTime());
                const rMin = baseDate.getUTCMinutes();
                
                baseDate.setUTCMinutes(vMin, 0, 0);
                if (rMin < vMin) {
                    baseDate.setUTCHours(baseDate.getUTCHours() - 1);
                }
                
                return baseDate.toISOString().replace(/[-:T]/g, '').slice(0, 12) + "00";
            }

            // 線状降水帯用の10分刻み・過去12時間の時間データ生成
            function generateSenjoTimes() {
                const list = [];
                const now = new Date();
                
                // 現在時刻から15分前を最新基準点とする
                const latest = new Date(now.getTime() - 15 * 60 * 1000);
                const minutes = latest.getMinutes();
                const roundedMinutes = Math.floor(minutes / 10) * 10;
                latest.setMinutes(roundedMinutes, 0, 0);

                // 12時間前まで10分刻み (12 * 6 = 72コマ + 1)
                for (let i = 72; i >= 0; i--) {
                    const t = new Date(latest.getTime() - i * 10 * 60 * 1000);
                    const y = t.getUTCFullYear();
                    const mo = String(t.getUTCMonth() + 1).padStart(2, '0');
                    const d = String(t.getUTCDate()).padStart(2, '0');
                    const h = String(t.getUTCHours()).padStart(2, '0');
                    const mi = String(t.getUTCMinutes()).padStart(2, '0');
                    const timeStr = `${y}${mo}${d}${h}${mi}00`;
                    
                    list.push({
                        basetime: timeStr,
                        validtime: timeStr,
                        layerMode: 'sjfcstmap',
                        folder: 'rasrf'
                    });
                }
                return list;
            }

            function updateSliderVisuals() {
                const isSenjo = currentLayerMode === 'sjfcstmap';
                const currentList = isSenjo ? senjoTimeData : timeData;
                if (!currentList.length) return;
                
                const index = parseInt(sliderInput.value);
                const maxVal = parseInt(sliderInput.max) || (currentList.length - 1);
                const percent = (index / maxVal) * 100;
                
                sliderProgress.style.width = `${percent}%`;
                timeDisplay.innerText = formatTimeCustom(currentList[index].validtime);
            }

            sliderInput.addEventListener('input', (e) => {
                updateSliderVisuals();
                updateRadar();
            });

            // 表示モード（雨雲・雷・線状降水帯）にあわせたスライダー幅・ラベル調整
            function adjustSliderRangeForMode() {
                const isSenjo = currentLayerMode === 'sjfcstmap';

                if (isSenjo) {
                    const activeDataCount = senjoTimeData.length;
                    sliderInput.max = activeDataCount - 1;
                    
                    // 線状降水帯モード時は、常に最新（現在・一番右端）に自動フォーカス
                    sliderInput.value = activeDataCount - 1;
                    
                    nowLabel.style.left = `50%`;
                    nowLabel.innerText = "6時間前";
                    
                    const leftLabel = document.querySelector('.relative.w-full.h-4.mt-2 span:first-child');
                    if (leftLabel) leftLabel.innerText = "12時間前";
                    
                    const endLabel = document.getElementById('end-label');
                    if (endLabel) endLabel.innerText = "現在";
                    
                    statusBadge.innerHTML = ''; // 予測・実況バッジはつけない
                    updateSliderVisuals();
                    return;
                }

                if (!timeData.length) return;
                
                // 従来の雨雲・雷用のラベル復元
                const leftLabel = document.querySelector('.relative.w-full.h-4.mt-2 span:first-child');
                if (leftLabel) leftLabel.innerText = "3時間前";
                nowLabel.innerText = "現在";
                
                const isRain = currentLayerMode === 'hrpns';
                const activeDataCount = isRain 
                    ? timeData.length 
                    : timeData.filter(t => t.layerMode !== 'rasrf').length;
                
                sliderInput.max = activeDataCount - 1;
                
                if (parseInt(sliderInput.value) > activeDataCount - 1) {
                    sliderInput.value = activeDataCount - 1;
                }
                
                const nowPercent = (currentRealtimeIndex / (activeDataCount - 1)) * 100;
                nowLabel.style.left = `${nowPercent}%`;
                
                const endLabel = document.getElementById('end-label');
                if (endLabel) {
                    endLabel.innerText = isRain ? "15時間後" : "1時間後";
                }
                
                updateSliderVisuals();
            }

            function updateRadar() {
                const isSenjo = currentLayerMode === 'sjfcstmap';

                if (isSenjo) {
                    if (!senjoTimeData.length) return;
                    const index = parseInt(sliderInput.value);
                    const mapZoom = map.getZoom();
                    const targetData = senjoTimeData[index];
                    const nativeZ = getValidEvenZoom(mapZoom, 'sjfcstmap');
                    
                    if (currentChartInstance) { currentChartInstance.update('none'); }

                    const currentKey = `${targetData.validtime}_sjfcstmap_${nativeZ}`;
                    if (lastInformedKey === currentKey) {
                        statusBadge.innerHTML = '';
                        return;
                    }
                    
                    if (dataTip) dataTip.style.opacity = "1";
                    drawLayer(targetData.basetime, targetData.validtime, nativeZ, currentKey, 'sjfcstmap', 'rasrf');
                    statusBadge.innerHTML = '';
                    return;
                }

                // 従来の雨雲・雷のレーダー表示処理
                if (!timeData.length) return;
                
                const index = parseInt(sliderInput.value);
                const mapZoom = map.getZoom();
                
                const targetData = timeData[index];
                
                let activeMode = currentLayerMode;
                let folder = 'nowc';
                
                if (currentLayerMode === 'hrpns') {
                    activeMode = targetData.layerMode; 
                    folder = targetData.folder;
                }

                const nativeZ = getValidEvenZoom(mapZoom, activeMode);
                
                if (currentChartInstance) { currentChartInstance.update('none'); }

                const isForecast = index > currentRealtimeIndex;
                const effectiveData = findEffectiveTime(index, activeMode);
                const currentKey = `${effectiveData.validtime}_${activeMode}_${nativeZ}`;

                if (lastInformedKey === currentKey) {
                    updateUI(index, isForecast, activeMode);
                    return;
                }
                
                if (dataTip) dataTip.style.opacity = "1";
                let bTime = !isForecast ? effectiveData.validtime : effectiveData.basetime;
                drawLayer(bTime, effectiveData.validtime, nativeZ, currentKey, activeMode, folder);
                updateUI(index, isForecast, activeMode);
            }

            function drawLayer(bTime, vTime, nativeZ, key, activeMode, folder) {
                // 線状降水帯（sjfcstmap）は、常に /none/ パス固定
                const midPath = activeMode === 'sjfcstmap' ? 'none' : (folder === 'rasrf' ? 'immed' : 'none');
                const url = `https://www.jma.go.jp/bosai/jmatile/data/${folder}/${bTime}/${midPath}/${vTime}/surf/${activeMode}/{z}/{x}/{y}.png`;
                
                const newLayer = L.tileLayer.fallbackRadar(url, {
                    pane: 'radarPane', className: 'radar-tiles',
                    minZoom: 4, maxZoom: 18, minNativeZoom: nativeZ, maxNativeZoom: nativeZ, 
                    opacity: 0, crossOrigin: true,
                    folder: folder,
                    activeMode: activeMode,
                    errorTileUrl: 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII='
                });
                newLayer.on('load', () => {
                    newLayer.setOpacity(0.78);
                    map.eachLayer(layer => { if (layer.options && layer.options.pane === 'radarPane' && layer !== newLayer) map.removeLayer(layer); });
                    lastInformedKey = key;
                    if (dataTip) dataTip.style.opacity = "0";
                });
                newLayer.addTo(map);
            }

            function updateUI(index, isForecast, activeMode) {
                if (activeMode === 'sjfcstmap') {
                    statusBadge.innerHTML = '';
                    return;
                }
                if (index === currentRealtimeIndex) {
                    statusBadge.innerHTML = `<span class="bg-blue-100 text-blue-700 text-[11px] px-2.5 py-0.5 rounded font-black tracking-widest">実況</span>`;
                } else if (isForecast) {
                    if (activeMode === 'rasrf') {
                        statusBadge.innerHTML = `<span class="bg-orange-100 text-orange-700 text-[11px] px-2.5 py-0.5 rounded font-black tracking-widest">長予報</span>`;
                    } else {
                        statusBadge.innerHTML = `<span class="bg-orange-100 text-orange-700 text-[11px] px-2.5 py-0.5 rounded font-black tracking-widest">予報</span>`;
                    }
                } else {
                    statusBadge.innerHTML = `<span class="bg-slate-100 text-slate-600 text-[11px] px-2.5 py-0.5 rounded font-black tracking-widest">過去</span>`;
                }
            }

            prevBtn.onclick = () => {
                let currentIndex = parseInt(sliderInput.value);
                if (currentIndex > 0) {
                    sliderInput.value = currentIndex - 1;
                    updateSliderVisuals();
                    updateRadar();
                }
            };

            nextBtn.onclick = () => {
                let currentIndex = parseInt(sliderInput.value);
                if (currentIndex < parseInt(sliderInput.max)) {
                    sliderInput.value = currentIndex + 1;
                    updateSliderVisuals();
                    updateRadar();
                }
            };

            map.on('zoomend', updateRadar);

            function setLayerMode(mode) {
                if (currentLayerMode === mode) return;
                currentLayerMode = mode;
                
                const isRain = mode === 'hrpns';
                const isThunder = mode === 'thns';
                const isSenjo = mode === 'sjfcstmap';
                
                document.getElementById('mode-rain').className = isRain 
                    ? "px-3 py-1.5 text-[10px] font-bold rounded-lg bg-blue-600 text-white shadow-md shadow-blue-200 transition-all h-full flex items-center" 
                    : "px-3 py-1.5 text-[10px] font-bold rounded-lg text-slate-500 hover:bg-slate-100 transition-all h-full flex items-center";
                
                document.getElementById('mode-thunder').className = isThunder 
                    ? "px-3 py-1.5 text-[10px] font-bold rounded-lg bg-yellow-500 text-white shadow-md shadow-yellow-200 transition-all h-full flex items-center" 
                    : "px-3 py-1.5 text-[10px] font-bold rounded-lg text-slate-500 hover:bg-slate-100 transition-all h-full flex items-center";

                document.getElementById('mode-senjo').className = isSenjo 
                    ? "px-3 py-1.5 text-[10px] font-bold rounded-lg bg-red-600 text-white shadow-md shadow-red-200 transition-all h-full flex items-center" 
                    : "px-3 py-1.5 text-[10px] font-bold rounded-lg text-slate-500 hover:bg-slate-100 transition-all h-full flex items-center";
                
                if (isRain) {
                    document.getElementById('app-title').innerText = "EWC 雨雲・長予報レーダー";
                    document.getElementById('title-dot').className = "w-2.5 h-2.5 bg-blue-600 rounded-full animate-pulse shadow-[0_0_8px_rgba(37,99,235,0.6)]";
                } else if (isThunder) {
                    document.getElementById('app-title').innerText = "EWC 雷活動度レーダー";
                    document.getElementById('title-dot').className = "w-2.5 h-2.5 bg-yellow-400 rounded-full animate-pulse shadow-[0_0_8px_rgba(250,204,21,0.6)]";
                } else if (isSenjo) {
                    document.getElementById('app-title').innerText = "EWC 線状降水帯レーダー";
                    document.getElementById('title-dot').className = "w-2.5 h-2.5 bg-red-600 rounded-full animate-pulse shadow-[0_0_8px_rgba(239,68,68,0.6)]";
                }

                document.getElementById('analysis-title').innerText = isRain ? "降水量推移" : (isThunder ? "雷活動度推移" : "");
                
                // 凡例表示切り替え
                document.getElementById('legend-rain').style.opacity = isRain ? "1" : "0";
                document.getElementById('legend-rain').style.pointerEvents = isRain ? "auto" : "none";
                document.getElementById('legend-senjo').style.opacity = isSenjo ? "1" : "0";
                document.getElementById('legend-senjo').style.pointerEvents = isSenjo ? "auto" : "none";
                
                // 線状降水帯時はグラフセクションを隠す
                if (isSenjo) {
                    graphSection.classList.add('hidden');
                    graphSection.classList.remove('flex');
                    if (clickMarker) { map.removeLayer(clickMarker); clickMarker = null; }
                }
                
                adjustSliderRangeForMode();
                lastInformedKey = ""; 
                updateRadar();
            }
            
            document.getElementById('mode-rain').onclick = () => setLayerMode('hrpns');
            document.getElementById('mode-thunder').onclick = () => setLayerMode('thns');
            document.getElementById('mode-senjo').onclick = () => setLayerMode('sjfcstmap');

            function getChartColor(val, mode) {
                let hex = 'transparent';
                if (mode === 'hrpns' || mode === 'rasrf') {
                    if (val >= 80) hex = '#b40068'; else if (val >= 50) hex = '#ff2800'; else if (val >= 30) hex = '#ff9900'; else if (val >= 20) hex = '#faf500';
                    else if (val >= 10) hex = '#0041ff'; else if (val >= 5) hex = '#218cff'; else if (val >= 1) hex = '#a0d2ff';
                    else if (val > 0) hex = '#f2f2ff'; 
                } else {
                    if (val >= 4) hex = '#b40068'; else if (val >= 3) hex = '#ff2800'; else if (val >= 2) hex = '#ff9900'; else if (val >= 1) hex = '#ffff00';
                }
                if (hex === 'transparent') return { bg: 'rgba(226, 232, 240, 0.4)', border: 'rgba(203, 213, 225, 0.4)' };
                const r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
                const luminance = 0.299*r + 0.587*g + 0.114*b;
                const borderColor = luminance > 220 ? 'rgba(100, 116, 139, 0.8)' : `rgba(${r}, ${g}, ${b}, 1)`;
                return { bg: `rgba(${r}, ${g}, ${b}, 1)`, border: borderColor };
            }

            function getColorValue(r, g, b, mode) {
                let minDist = Infinity; let resultVal = 0;
                const colors = (mode === 'hrpns' || mode === 'rasrf') ? [
                    { val: 80, r: 180, g: 0, b: 104 }, { val: 50, r: 255, g: 40, b: 0 }, { val: 30, r: 255, g: 153, b: 0 }, { val: 20, r: 250, g: 245, b: 0 },   
                    { val: 10, r: 0, g: 65, b: 255 }, { val: 5,  r: 33, g: 140, b: 255 }, { val: 1,  r: 160, g: 210, b: 255 }, { val: 0.1,r: 242, g: 242, b: 255 } 
                ] : [
                    { val: 4, r: 180, g: 0, b: 104 }, { val: 3, r: 255, g: 40, b: 0 }, { val: 2, r: 255, g: 153, b: 0 }, { val: 1, r: 255, g: 255, b: 0 }     
                ];
                for (const c of colors) {
                    const dist = (r - c.r) ** 2 + (g - c.g) ** 2 + (b - c.b) ** 2;
                    if (dist < minDist) { minDist = dist; resultVal = c.val; }
                }
                return minDist > 5000 ? 0 : resultVal;
            }

            // 地図タップ時の降雨推移・雷グラフ表示 (線状降水帯モード時はガード)
            map.on('click', async (e) => {
                if(!timeData.length || currentLayerMode === 'sjfcstmap') return;
                const thisSessionId = ++analysisSessionId;
                if (currentChartInstance) { currentChartInstance.destroy(); currentChartInstance = null; }
                if (playInterval) { clearInterval(playInterval); playInterval = null; playIcon.className = 'fas fa-play text-sm'; }
                if (clickMarker) clickMarker.setLatLng(e.latlng); else clickMarker = L.marker(e.latlng).addTo(map);

                graphSection.classList.remove('hidden');
                graphSection.classList.add('flex');
                
                chartContainer.innerHTML = `<div id="chart-loading" class="flex flex-col items-center gap-3"><div class="w-6 h-6 border-4 border-blue-600 border-t-transparent rounded-full animate-spin"></div><span class="text-[10px] font-black text-blue-600 uppercase tracking-widest">Scanning Data...</span></div>`;

                // 表示する目盛りの範囲
                const graphTimeData = timeData
                    .slice(0, parseInt(sliderInput.max) + 1)
                    .map((t, i) => ({ t, i, isForecast: i > currentRealtimeIndex }));
                
                setTimeout(async () => {
                    if (thisSessionId !== analysisSessionId) return;
                    try {
                        const results = await Promise.all(graphTimeData.map(({ t, i, isForecast }) => {
                            return new Promise((resolve) => {
                                let activeMode = currentLayerMode;
                                let folder = 'nowc';
                                if (currentLayerMode === 'hrpns') {
                                    activeMode = t.layerMode;
                                    folder = t.folder;
                                }

                                const nativeZ = getValidEvenZoom(10, activeMode);
                                
                                // タイルの計算
                                const xFract = ((e.latlng.lng + 180) / 360) * Math.pow(2, nativeZ);
                                const yFract = ((1 - Math.log(Math.tan(e.latlng.lat * Math.PI / 180) + 1 / Math.cos(e.latlng.lat * Math.PI / 180)) / Math.PI) / 2) * Math.pow(2, nativeZ);
                                const xtileLocal = Math.floor(xFract), ytileLocal = Math.floor(yFract);
                                const xPixelLocal = Math.floor((xFract - xtileLocal) * 256), yPixelLocal = Math.floor((yFract - ytileLocal) * 256);

                                const target = findEffectiveTime(i, activeMode);
                                const bTime = !isForecast ? target.validtime : target.basetime;
                                
                                // クリック推移データ取得における優先URLと代替URL
                                const midPath = folder === 'rasrf' ? 'immed' : 'none';
                                const primaryUrl = `https://www.jma.go.jp/bosai/jmatile/data/${folder}/${bTime}/${midPath}/${target.validtime}/surf/${activeMode}/${nativeZ}/${xtileLocal}/${ytileLocal}.png`;
                                const fallbackUrl = folder === 'rasrf' ? `https://www.jma.go.jp/bosai/jmatile/data/${folder}/${bTime}/${midPath === 'immed' ? 'none' : 'immed'}/${target.validtime}/surf/${activeMode}/${nativeZ}/${xtileLocal}/${ytileLocal}.png` : null;
                                
                                if (tileCache[primaryUrl]) {
                                    const pixels = tileCache[primaryUrl];
                                    if (pixels === 'error') return resolve({ value: 0, isForecast, time: t.validtime });
                                    const pIdx = (yPixelLocal * 256 + xPixelLocal) * 4;
                                    const alpha = pixels[pIdx+3];
                                    if (alpha < 10) resolve({ value: 0, isForecast, time: t.validtime });
                                    else resolve({ value: getColorValue(pixels[pIdx], pixels[pIdx+1], pixels[pIdx+2], activeMode), isForecast, time: t.validtime });
                                    return;
                                }

                                loadImageWithFallback(primaryUrl, fallbackUrl).then((img) => {
                                    try {
                                        const cv = document.createElement('canvas'); cv.width = 256; cv.height = 256;
                                        const ctx = cv.getContext('2d', { willReadFrequently: true }); ctx.drawImage(img, 0, 0);
                                        const imgData = ctx.getImageData(0, 0, 256, 256).data;
                                        tileCache[primaryUrl] = imgData;
                                        const pIdx = (yPixelLocal * 256 + xPixelLocal) * 4;
                                        const alpha = imgData[pIdx+3];
                                        if (alpha < 10) resolve({ value: 0, isForecast, time: t.validtime });
                                        else resolve({ value: getColorValue(imgData[pIdx], imgData[pIdx+1], imgData[pIdx+2], activeMode), isForecast, time: t.validtime });
                                    } catch(e) { resolve({ value: 0, isForecast, time: t.validtime }); }
                                }).catch(() => {
                                    tileCache[primaryUrl] = 'error';
                                    resolve({ value: 0, isForecast, time: t.validtime });
                                });
                            });
                        }));
                        if (thisSessionId !== analysisSessionId) return;

                        requestAnimationFrame(() => {
                            if (thisSessionId !== analysisSessionId) return;
                            chartContainer.innerHTML = '';
                            const canvas = document.createElement('canvas'); canvas.style.width = '100%'; canvas.style.height = '100%';
                            chartContainer.appendChild(canvas);

                            const labels = results.map(r => { const d = parseJmaTime(r.time); return `${d.getHours()}:${String(d.getMinutes()).padStart(2,'0')}`; });
                            const ranks = results.map(r => getRankFromValue(r.value, currentLayerMode));
                            const colors = results.map(r => getChartColor(r.value, currentLayerMode));

                            currentChartInstance = new Chart(canvas.getContext('2d'), {
                                type: 'bar',
                                data: {
                                    labels: labels,
                                    datasets: [{
                                        data: ranks,
                                        backgroundColor: colors.map(c => c.bg),
                                        borderColor: colors.map(c => c.border),
                                        borderWidth: 1.5, borderRadius: 6, barPercentage: 0.85, categoryPercentage: 0.9
                                    }]
                                },
                                plugins: [chartHighlightPlugin],
                                options: {
                                    responsive: true, maintainAspectRatio: false,
                                    layout: { padding: { left: 8, right: 12, top: 16, bottom: 8 } },
                                    animation: { duration: 400 },
                                    plugins: { 
                                        legend: { display: false },
                                        tooltip: {
                                            callbacks: {
                                                label: function(context) {
                                                    const rank = context.raw;
                                                    const valStr = getLabelFromRank(rank, currentLayerMode);
                                                    const unit = currentLayerMode === 'hrpns' ? ' mm/h' : ' (活動度)';
                                                    return valStr + unit;
                                                }
                                            }
                                        }
                                    },
                                    scales: {
                                        y: {
                                            beginAtZero: true, 
                                            max: currentLayerMode === 'hrpns' ? 8 : 4,
                                            ticks: { 
                                                font: { size: 9, weight: 'bold' }, stepSize: 1,
                                                callback: function(value) { return getLabelFromRank(value, currentLayerMode); },
                                                color: (ctx) => {
                                                    const v = ctx.tick.value; if (v === 0) return '#94a3b8';
                                                    if (currentLayerMode === 'hrpns') {
                                                        if (v === 8) return '#b40068'; if (v === 7) return '#ff2800'; if (v === 6) return '#ff9900';
                                                        if (v === 5) return '#faf500'; if (v === 4) return '#0041ff'; if (v === 3) return '#218cff';
                                                        if (v === 2) return '#a0d2ff'; if (v === 1) return '#94a3b8'; 
                                                    } else {
                                                        if (v === 4) return '#b40068'; if (v === 3) return '#ff2800'; if (v === 2) return '#ff9900'; if (v === 1) return '#ffff00';
                                                    }
                                                    return '#94a3b8';
                                                }
                                            },
                                            grid: { color: 'rgba(203, 213, 225, 0.6)' }, border: { display: false }
                                        },
                                        x: { ticks: { font: { size: 9, weight: '700' }, color: '#64748b', maxTicksLimit: 6, autoSkip: true, maxRotation: 0 }, grid: { display: false }, border: { display: false } }
                                    }
                                }
                            });
                        });
                    } catch (err) { console.error(err); }
                }, 60); 
            });

            // データのタイムライン取得
            async function fetchJmaTimes() {
                try {
                    // 線状降水帯の時間データを再生成して更新
                    senjoTimeData = generateSenjoTimes();

                    // ナウキャスト(nowc)リストのロード
                    const urls = ['https://www.jma.go.jp/bosai/jmatile/data/nowc/targetTimes_N1.json', 'https://www.jma.go.jp/bosai/jmatile/data/nowc/targetTimes_N2.json'];
                    const res = await Promise.all(urls.map(u => fetch(u).then(r => r.json()).catch(() => [])));
                    let allNowc = res.flat(); if(!allNowc.length) return;
                    
                    const mapData = new Map(); allNowc.forEach(t => {
                        if (t && t.validtime) mapData.set(t.validtime, t);
                    });
                    let sortedNowc = Array.from(mapData.values()).sort((a,b) => a.validtime.localeCompare(b.validtime));
                    
                    let rIdx = 0; 
                    for(let i=sortedNowc.length-1; i>=0; i--) { 
                        if(sortedNowc[i].basetime === sortedNowc[i].validtime) { rIdx = i; break; } 
                    }
                    const rTimeStr = sortedNowc[rIdx].validtime;
                    const rDate = parseJmaTime(rTimeStr);
                    
                    // 過去3時間のデータをフィルタリング
                    const limitStr = new Date(rDate.getTime() - 3*60*60*1000).toISOString().replace(/[-:T]/g, '').slice(0, 12) + "00";
                    let filteredNowc = sortedNowc.filter(t => t.validtime >= limitStr).map(t => ({
                        ...t,
                        layerMode: 'hrpns',
                        folder: 'nowc'
                    }));
                    
                    currentRealtimeIndex = filteredNowc.findIndex(t => t.validtime === rTimeStr);

                    // 15時間先までの降水予報(rasrf)リストをロード
                    let rasrfData = [];
                    try {
                        const rasrfRes = await fetch('https://www.jma.go.jp/bosai/jmatile/data/rasrf/targetTimes.json');
                        if (rasrfRes.ok) {
                            const rawRasrf = await rasrfRes.json();
                            const lastNowcTime = filteredNowc[filteredNowc.length - 1].validtime;
                            
                            rasrfData = rawRasrf
                                .filter(item => {
                                    const vTime = typeof item === 'string' ? item : item.validtime;
                                    return vTime > lastNowcTime;
                                })
                                .sort((a, b) => {
                                    const vA = typeof a === 'string' ? a : a.validtime;
                                    const vB = typeof b === 'string' ? b : b.validtime;
                                    return vA.localeCompare(vB);
                                })
                                .map(item => {
                                    const vTime = typeof item === 'string' ? item : item.validtime;
                                    
                                    // 予報対象時刻（validtime）の「分」に連動した、本来の発表時刻（basetime）を正確に逆算
                                    const bTime = calculateRasrfBasetime(vTime, rDate);
                                    
                                    return {
                                        basetime: bTime,
                                        validtime: vTime,
                                        layerMode: 'rasrf',
                                        folder: 'rasrf'
                                    };
                                });
                        }
                    } catch (rasrfError) {
                        console.warn('Long forecast load failed', rasrfError);
                    }

                    // フル結合
                    timeData = [...filteredNowc, ...rasrfData];

                    adjustSliderRangeForMode();

                    // 初期状態で現在時刻を表示 (線状降水帯モード時はadjust側で一番右端に強制設定されます)
                    if (currentLayerMode !== 'sjfcstmap') {
                        if (sliderInput.value == 0 || parseInt(sliderInput.value) >= timeData.length) {
                            sliderInput.value = currentRealtimeIndex;
                        }
                    }
                    
                    updateSliderVisuals();
                    updateRadar();
                } catch (e) { console.error(e); }
            }

            playBtn.onclick = () => {
                if (playInterval) {
                    clearInterval(playInterval); playInterval = null;
                    playIcon.className = 'fas fa-play text-sm';
                } else {
                    playIcon.className = 'fas fa-pause text-sm';
                    playInterval = setInterval(() => {
                        let v = parseInt(sliderInput.value) + 1; 
                        let maxLimit = parseInt(sliderInput.max);
                        if (v > maxLimit) v = 0;
                        sliderInput.value = v;
                        updateSliderVisuals();
                        updateRadar();
                    }, 450);
                }
            };
            
            fetchJmaTimes(); 
            setInterval(fetchJmaTimes, 60000); // 1分おきに更新
        });
    </script>
</body>
