<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EWC 警報級の可能性</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=JetBrains+Mono:wght@400;700;800&display=swap');
        
        body { font-family: 'Noto Sans JP', sans-serif; background-color: #f8fafc; }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; height: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        #fullScreenLoading {
            position: fixed;
            inset: 0;
            background: #f8fafc;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease-out;
        }

        #map {
            height: 100%;
            width: 100%;
            background: #bae6fd;
            z-index: 1;
        }

        .map-legend {
            background: rgba(255, 255, 255, 0.95);
            padding: 8px;
            border-radius: 10px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            border: 1px solid #e2e8f0;
            font-size: 10px;
            font-weight: bold;
        }

        .leaflet-interactive {
            transition: fill-opacity 0.2s, stroke-width 0.1s;
            outline: none;
        }
        
        /* バッジとテーブルのスタイル */
        .rank-high { color: #ffffff; background-color: #dc2626; border-radius: 4px; padding: 2px 6px; font-weight: 900; font-size: 9px; display: inline-block; white-space: nowrap; box-shadow: 0 2px 4px rgba(220,38,38,0.15); }
        .rank-mid { color: #7f1d1d; background-color: #fca5a5; border-radius: 4px; padding: 2px 6px; font-weight: 900; font-size: 9px; display: inline-block; white-space: nowrap; }
        .rank-text-none { color: #cbd5e1; font-size: 9px; font-weight: 700; }

        .analysis-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
        }
        .analysis-table th, .analysis-table td {
            padding: 8px 6px;
            text-align: center;
            border-bottom: 1px solid #f1f5f9;
        }
        .analysis-table th:first-child, .analysis-table td:first-child {
            text-align: left;
            position: sticky;
            left: 0;
            z-index: 10;
            font-weight: 800;
            padding-left: 10px;
            min-width: 110px;
            border-right: 1px solid #f1f5f9;
        }
        
        .number-highlight {
            font-family: 'JetBrains Mono', monospace;
            font-weight: 800;
            color: #1d4ed8;
            font-size: 1.05em;
            margin: 0 0.15em;
            letter-spacing: -0.05em;
        }

        /* マトリックス表示専用スタイル（横スクロールなし w-full table-fixed 化） */
        .matrix-table {
            border-collapse: separate;
            border-spacing: 0;
            table-layout: fixed;
            width: 100%;
        }
        .matrix-table th, .matrix-table td {
            border-bottom: 1px solid #e2e8f0;
            border-right: 1px solid #e2e8f0;
            word-break: break-all; /* 入り切らないテキストの自然な改行を許可 */
        }
        .matrix-sticky-col {
            position: sticky;
            left: 0;
            z-index: 20;
            background-color: #f8fafc;
            border-right: 2px solid #cbd5e1 !important;
            font-weight: 900;
        }
        .matrix-sticky-header {
            position: sticky;
            top: 0;
            z-index: 30;
            background-color: #f1f5f9;
            border-bottom: 2px solid #cbd5e1 !important;
        }
        .matrix-sticky-corner {
            position: sticky;
            top: 0;
            left: 0;
            z-index: 40;
            background-color: #e2e8f0;
            border-right: 2px solid #cbd5e1 !important;
            border-bottom: 2px solid #cbd5e1 !important;
        }

        /* セル内コンテナ：高さを固定せず、バッジが増えたら自動で改行して下に広げる */
        .matrix-cell-container {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            justify-content: center;
            align-items: center;
            padding: 2px 0;
        }
    </style>
</head>
<body class="text-slate-900 min-h-screen flex flex-col overflow-hidden">

    <!-- ローディング画面 -->
    <div id="fullScreenLoading">
        <div class="text-center px-6 w-full max-sm:px-4">
            <div class="inline-block animate-spin rounded-full h-12 w-12 border-4 border-blue-600 border-t-transparent mb-6"></div>
            <h2 class="text-xl font-black text-slate-800 mb-2">気象庁データ解析中</h2>
            <p id="loadingMessage" class="text-sm text-slate-500 font-bold mb-4">XMLフィードから電文を取得中...</p>
        </div>
    </div>

    <!-- 取得電文一覧モーダル (eキーで表示) -->
    <div id="feedListModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[9999] hidden flex justify-center items-center p-4 md:p-8 transition-opacity">
        <div class="bg-white w-full max-w-5xl h-[85vh] rounded-3xl shadow-2xl flex flex-col overflow-hidden border border-slate-200">
            <div class="p-5 border-b border-slate-200 flex justify-between items-center bg-slate-50 shrink-0">
                <h2 class="text-xl font-black text-slate-800 flex items-center gap-2 italic">
                    <i data-lucide="list-tree" class="w-6 h-6 text-blue-600"></i> 
                    取得電文一覧 <span class="text-sm font-bold text-slate-500 not-italic ml-2">(<span id="feedCount" class="text-blue-600">0</span>件)</span>
                </h2>
                <button onclick="hideAllFeedsModal()" class="p-2 hover:bg-slate-200 rounded-full transition-colors text-slate-500">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>
            <div class="flex-1 overflow-y-auto p-0 custom-scrollbar bg-white">
                <table class="w-full text-left border-collapse">
                    <thead class="sticky top-0 bg-slate-100 shadow-sm z-10 text-[11px] text-slate-500 uppercase tracking-widest">
                        <tr>
                            <th class="p-4 font-black">発表日時</th>
                            <th class="p-4 font-black">発表官署</th>
                            <th class="p-4 font-black">タイトル</th>
                            <th class="p-4 font-black text-center">XML</th>
                        </tr>
                    </thead>
                    <tbody id="feedListTableBody" class="divide-y divide-slate-100">
                        <!-- JSで生成 -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- 警報リスク地域一覧モーダル (rキーで表示) -->
    <div id="riskListModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[9999] hidden flex justify-center items-center p-4 md:p-8 transition-opacity">
        <div class="bg-white w-full max-w-5xl h-[85vh] rounded-3xl shadow-2xl flex flex-col overflow-hidden border border-slate-200">
            <div class="p-5 border-b border-slate-200 flex justify-between items-center bg-slate-50 shrink-0">
                <h2 class="text-xl font-black text-slate-800 flex items-center gap-2 italic">
                    <i data-lucide="alert-triangle" class="w-6 h-6 text-red-600"></i> 
                    警報級の可能性がある地域 <span class="text-sm font-bold text-slate-500 not-italic ml-2">(<span id="riskCount" class="text-red-600">0</span>地域)</span>
                </h2>
                <button onclick="hideRiskListModal()" class="p-2 hover:bg-slate-200 rounded-full transition-colors text-slate-500">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>
            <div class="flex-1 overflow-y-auto p-4 md:p-6 custom-scrollbar bg-slate-50">
                <div id="riskListContent" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                    <!-- JSで生成 -->
                </div>
            </div>
        </div>
    </div>

    <div class="flex-1 flex flex-col h-screen max-h-screen overflow-hidden">
        <!-- ヘッダー -->
        <header class="bg-white border-b border-slate-200 p-2 md:p-2.5 shrink-0 shadow-sm z-50">
            <div class="max-w-7xl mx-auto flex items-center justify-between gap-2 md:gap-4">
                <div class="flex items-center gap-2">
                    <button id="headerBackButton" onclick="handleGlobalBack()" class="px-2 py-1 hover:bg-slate-100 rounded-lg transition-colors group text-xs font-bold text-slate-600 hover:text-blue-600 hidden">
                        ←戻る
                    </button>
                    <h1 class="text-sm md:text-lg font-black text-slate-900 tracking-tighter leading-none italic flex items-center gap-1.5">
                        <span class="w-1.5 h-1.5 bg-blue-600 rounded-full"></span>
                        EWC気象情報（警報級の可能性）
                    </h1>
                </div>

                <div class="flex items-center gap-2 md:gap-4 overflow-hidden">
                    <span id="lastUpdate" class="text-[9px] text-slate-400 font-bold hidden sm:inline whitespace-nowrap"></span>
                    
                    <button onclick="showRiskListModal()" class="px-2 py-1 rounded-lg text-[9px] font-black transition-all bg-red-50 text-red-600 hover:bg-red-100 border border-red-200 shadow-sm shrink-0 flex items-center gap-1">
                        <i data-lucide="alert-triangle" class="w-3 h-3"></i> リスク一覧
                    </button>
                    
                    <div id="viewToggle" class="flex bg-slate-100 p-0.5 rounded-lg shrink-0">
                        <button onclick="switchView('map')" id="btnMap" class="px-2 py-1 rounded-md text-[9px] font-black transition-all bg-white text-blue-600 shadow-sm shrink-0">地図</button>
                        <!-- 一括表示は初期状態で非表示 (hidden) -->
                        <button onclick="switchView('matrix')" id="btnMatrix" class="px-2 py-1 rounded-md text-[9px] font-black transition-all text-slate-500 hover:text-slate-700 shrink-0 hidden">一括表示</button>
                        <!-- 地域一覧にダブルタップ＆ダブルクリックイベントを設定 -->
                        <button onclick="handleListClick()" ondblclick="unlockMatrixView()" id="btnList" class="px-2 py-1 rounded-md text-[9px] font-black transition-all text-slate-500 hover:text-slate-700 shrink-0 select-none" title="ダブルクリックで一括表示を解放">地域一覧</button>
                    </div>
                    <button onclick="init()" class="p-1 hover:bg-slate-100 rounded-full transition-colors shrink-0 border border-slate-200" title="更新">
                        <i data-lucide="refresh-cw" class="w-3 h-3 text-slate-600"></i>
                    </button>
                </div>
            </div>
        </header>

        <main class="flex-1 overflow-hidden relative bg-slate-50 flex w-full">
            <!-- 左ペイン（地図 or マトリックス or 一覧表示） -->
            <div id="leftPane" class="flex-1 relative transition-all duration-300 ease-in-out min-w-0">
                
                <!-- 地図表示ページ -->
                <div id="mapView" class="absolute inset-0">
                    <div id="map"></div>

                    <!-- 凡例 -->
                    <div id="mapLegend" class="absolute bottom-6 left-4 md:left-6 z-[1000] map-legend space-y-1 pointer-events-none">
                        <div class="text-[8px] font-black text-slate-500 mb-1 uppercase tracking-widest">警報級の可能性</div>
                        <div class="flex items-center gap-1.5 text-[9px] font-bold text-slate-800">
                            <span class="w-2.5 h-2.5 rounded-[2px] bg-[#dc2626] shadow-inner"></span> 高い
                        </div>
                        <div class="flex items-center gap-1.5 text-[9px] font-bold text-slate-800 mt-1">
                            <span class="w-2.5 h-2.5 rounded-[2px] bg-[#fca5a5] shadow-inner"></span> 中程度
                        </div>
                        <div class="flex items-center gap-1.5 text-[9px] font-bold text-slate-800 mt-1">
                            <span class="w-2.5 h-2.5 rounded-[2px] bg-[#ffffff] border border-slate-300"></span> 発表なし
                        </div>
                    </div>
                    
                    <!-- ヒント -->
                    <div id="mapHint" class="absolute top-4 left-1/2 -translate-x-1/2 z-[1000] bg-white/90 backdrop-blur-sm px-2.5 py-1 rounded-full border border-slate-200 shadow-sm pointer-events-none">
                        <p class="text-[8px] font-bold text-slate-600 flex items-center gap-1">
                            <i data-lucide="info" class="w-2.5 h-2.5 text-blue-600"></i> 都道府県を選択して詳細を表示
                        </p>
                    </div>
                </div>

                <!-- 一括マトリックス表示ページ -->
                <div id="matrixView" class="absolute inset-0 overflow-hidden p-1.5 md:p-3 translate-x-full opacity-0 pointer-events-none transition-all duration-300 bg-slate-50 flex flex-col gap-1.5">
                    <div class="shrink-0 flex flex-col sm:flex-row sm:items-center justify-between gap-1.5 bg-white p-2 rounded-xl border border-slate-200 shadow-sm">
                        <div>
                            <h2 class="text-xs md:text-sm font-black text-slate-800 tracking-tight flex items-center gap-1">
                                <i class="w-3.5 h-3.5 text-red-600" data-lucide="grid"></i> 全都道府県リスク一括表示
                            </h2>
                            <p class="text-[8px] md:text-[9px] text-slate-500 font-bold mt-0.5">空欄（警報発表なし）の時間帯は自動で「〜〜〜」にギュッと凝縮されます。リスクのある重要な日程に自動幅調整されます。</p>
                        </div>
                    </div>

                    <!-- メインマトリックスコンテナ (横スクロールを完全に禁止し、セルの縦方向の自然な拡張を許容) -->
                    <div class="flex-1 overflow-y-auto overflow-x-hidden rounded-xl border border-slate-200 bg-white shadow-md custom-scrollbar relative">
                        <table class="matrix-table text-[8px] md:text-[10px]">
                            <thead id="matrixHeader" class="matrix-sticky-header">
                                <!-- JSで動的生成 -->
                            </thead>
                            <tbody id="matrixBody">
                                <!-- JSで動的生成 -->
                            </tbody>
                        </table>
                    </div>
                </div>

                <!-- 地域一覧表示ページ -->
                <div id="listView" class="absolute inset-0 overflow-y-auto p-3 md:p-5 custom-scrollbar translate-x-full opacity-0 pointer-events-none transition-all duration-300 bg-[#f8fafc]">
                    <div class="max-w-6xl mx-auto">
                        <div class="flex items-end justify-between gap-4 mb-3">
                            <div>
                                <h2 class="text-lg sm:text-xl font-black text-slate-900 tracking-tighter italic">地域を選択してください</h2>
                                <p class="text-[9px] text-slate-500 font-bold">全国の警報級リスク（XMLフィード解析）</p>
                            </div>
                        </div>
                        <div id="prefGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-3 pb-20"></div>
                    </div>
                </div>
            </div>

            <!-- 右ペイン（詳細表示サイドパネル） -->
            <div id="rightPane" class="absolute inset-y-0 right-0 w-full md:w-[450px] lg:w-[550px] bg-white border-l border-slate-200 shadow-2xl transform translate-x-full transition-transform duration-300 ease-in-out z-[2000] flex flex-col shrink-0">
                <div class="p-2.5 border-b border-slate-100 flex items-center justify-between shrink-0 bg-white shadow-sm z-10">
                    <div class="flex-1 min-w-0 pr-4">
                        <span class="text-[8px] bg-slate-100 border border-slate-200 text-slate-500 font-black px-1 py-0.5 rounded uppercase tracking-wider">Analysis Result</span>
                        <h2 id="detailTitle" class="text-base sm:text-xl font-black text-slate-900 tracking-tighter italic mt-0.5 truncate"></h2>
                    </div>
                    <div class="flex items-center gap-1 shrink-0">
                        <button onclick="closeDetail()" class="p-1 hover:bg-slate-100 rounded-full transition-colors text-slate-500 border border-transparent hover:border-slate-200" title="閉じる">
                            <i data-lucide="x" class="w-4 h-4"></i>
                        </button>
                    </div>
                </div>
                <div id="detailContent" class="flex-1 overflow-y-auto p-2.5 md:p-4 custom-scrollbar bg-slate-50 pb-20">
                    <!-- ここに詳細情報（マトリックス表）が注入される -->
                </div>
            </div>
        </main>
    </div>

    <script>
        const FEEDS = [
            "https://www.data.jma.go.jp/developer/xml/feed/extra.xml",
            "https://www.data.jma.go.jp/developer/xml/feed/regular.xml"
        ];

        const TYPE_NAME_MAP = {
            "雨の警報級の可能性": "大雨",
            "大雨の警報級の可能性": "大雨",
            "雪の警報級の可能性": "大雪",
            "風（風雪）の警報級の可能性": "暴風",
            "波の警報級の可能性": "波浪",
            "潮位の警報級の可能性": "高潮",
            "土砂災害の警報級の可能性": "土砂災害"
        };

        const SORT_ORDER_SUMMARY = ["２４時間最大雨量", "２４時間最大降雪量", "最大風速", "波", "波高"];
        const SORT_ORDER_RANK = ["大雨", "大雪", "暴風", "波浪", "高潮", "土砂災害"];
        const SORT_ORDER_DETAIL = ["１時間最大雨量", "３時間最大雨量", "２４時間最大雨量", "６時間最大降雪量", "２４時間最大降雪量", "最大風速", "最大風速（陸上）", "最大風速（海上）", "波高", "波"];

        function getSortIndex(key, orderArray) {
            for (let i = 0; i < orderArray.length; i++) {
                if (key.startsWith(orderArray[i])) return i;
            }
            return 999; 
        }

        // スマホでの2回タップ（ダブルタップ）でもアンロックが作動するための検出ロジック
        let lastListClickTime = 0;
        window.handleListClick = function() {
            // 通常の「地域一覧」画面切り替え
            switchView('list');

            const currentTime = new Date().getTime();
            const timeDiff = currentTime - lastListClickTime;
            
            // 350ミリ秒以内に再度押されたらダブルタップとみなしてアンロック
            if (timeDiff < 350 && timeDiff > 0) {
                unlockMatrixView();
            }
            lastListClickTime = currentTime;
        };

        // 一括表示ボタンをアンロックして表示する機能
        window.unlockMatrixView = function() {
            const btnMatrix = document.getElementById('btnMatrix');
            if (btnMatrix && btnMatrix.classList.contains('hidden')) {
                btnMatrix.classList.remove('hidden'); // ボタンを表示
                switchView('matrix'); // そのまま一括表示に切り替え
                
                // 開発者・配信向けであることがわかる通知トーストを画面下部に表示
                showDeveloperToast();
            }
        };

        // 開発者向けアンロック通知トースト
        function showDeveloperToast() {
            // 既存のトーストをクリア
            const existing = document.getElementById('devToast');
            if (existing) existing.remove();

            const toast = document.createElement('div');
            toast.id = 'devToast';
            toast.className = 'fixed bottom-6 left-1/2 -translate-x-1/2 z-[9999] bg-slate-900 text-white text-xs font-bold px-4 py-3 rounded-full shadow-2xl flex items-center gap-2 border border-slate-700 animate-bounce';
            toast.innerHTML = `<i data-lucide="terminal" class="w-4 h-4 text-emerald-400"></i> 開発者配信用「一括表示」モードを有効化しました`;
            document.body.appendChild(toast);
            lucide.createIcons();

            setTimeout(() => {
                toast.style.transition = 'opacity 0.6s ease';
                toast.style.opacity = '0';
                setTimeout(() => toast.remove(), 600);
            }, 3000);
        }

        function getElementsByLocalName(element, localName) {
            if (!element) return [];
            return Array.from(element.getElementsByTagName('*')).filter(el => el.localName === localName);
        }

        const PREF_MAP = {"01":"北海道","02":"青森県","03":"岩手県","04":"宮城県","05":"秋田県","06":"山形県","07":"福島県","08":"茨城県","09":"栃木県","10":"群馬県","11":"埼玉県","12":"千葉県","13":"東京都","14":"神奈川県","15":"新潟県","16":"富山県","17":"石川県","18":"福井県","19":"山梨県","20":"長野県","21":"岐阜県","22":"静岡県","23":"愛知県","24":"三重県","25":"滋賀県","26":"京都府","27":"大阪府","28":"兵庫県","29":"奈良県","30":"和歌山県","31":"鳥取県","32":"島根県","33":"岡山県","34":"広島県","35":"山口県","36":"徳島県","37":"香川県","38":"愛媛県","39":"高知県","40":"福岡県","41":"佐賀県","42":"長崎県","43":"熊本県","44":"大分県","45":"宮崎県","46":"鹿児島県","47":"沖縄県"};
        const PREF_GEOJSON_URL = "https://raw.githubusercontent.com/dataofjapan/land/master/japan.geojson";

        const REGION_GROUPS = [
            { label: "北海道", color: "border-blue-200 bg-blue-50/50 hover:bg-blue-100", regions: [{ id: "hokkaido", name: "北海道", keywords: ["北海道", "札幌", "函館", "旭川", "室蘭", "釧路", "帯広", "網走", "稚内", "石狩", "渡島", "十勝", "胆振", "上川", "宗谷", "後志", "檜山", "根室", "日高", "空知", "留萌", "北見", "紋別"] }] },
            { label: "東北", color: "border-sky-200 bg-sky-50/50 hover:bg-sky-100", regions: [{ id: "aomori", name: "青森県", keywords: ["青森"] }, { id: "iwate", name: "岩手県", keywords: ["岩手", "盛岡"] }, { id: "miyagi", name: "宮城県", keywords: ["宮城", "仙台"] }, { id: "akita", name: "秋田県", keywords: ["秋田"] }, { id: "yamagata", name: "山形県", keywords: ["山形"] }, { id: "fukushima", name: "福島県", keywords: ["福島"] }]},

            { label: "九州・沖縄", color: "border-orange-200 bg-orange-50/50 hover:bg-orange-100", regions: [{ id: "fukuoka", name: "福岡県", keywords: ["福岡"] }, { id: "saga", name: "佐賀県", keywords: ["佐賀"] }, { id: "nagasaki", name: "長崎県", keywords: ["長崎", "壱岐", "対馬", "五島"] }, { id: "kumamoto", name: "熊本県", keywords: ["熊本"] }, { id: "oita", name: "大分県", keywords: ["大分"] }, { id: "miyazaki", name: "宮崎県", keywords: ["宮崎"] }, { id: "kagoshima", name: "鹿児島県", keywords: ["鹿児島", "奄美", "名瀬", "種子島", "屋久島", "薩摩", "大隅", "十島"] }, { id: "okinawa", name: "沖縄県", keywords: ["沖縄", "那覇", "宮古島", "石垣", "石垣島", "南大東", "南大東島", "八重山", "大東島", "先島"] }]}

        var map = null;
        var japanGeoData = null;
        var mainPrefLayer = null;
        var selectedPrefId = null;

        var allFeedData = []; 
        var globalRisks = {};
        var xmlDocs = {}; 

        // 全都道府県の一括監視用の全データ・キャッシュ
        var prefFullDataCache = {};

        async function fetchJsonSafely(url) {
            try {
                const response = await fetch(url);
                return response.ok ? await response.json() : null;
            } catch (e) { return null; }
        }

        async function init() {
            lucide.createIcons();
            const overlay = document.getElementById('fullScreenLoading');
            const msg = document.getElementById('loadingMessage');
            
            overlay.style.display = 'flex';
            overlay.style.opacity = '1';
            msg.innerText = "XMLフィードから全ての電文を取得中...";

            try {
                if (!japanGeoData) japanGeoData = await fetchJsonSafely(PREF_GEOJSON_URL);

                allFeedData = [];
                globalRisks = {};
                xmlDocs = {};
                prefFullDataCache = {};

                for (const url of FEEDS) {
                    const res = await fetch(url);
                    const xml = new DOMParser().parseFromString(await res.text(), "text/xml");
                    Array.from(xml.getElementsByTagName('entry')).forEach(entry => {
                        const link = getElementsByLocalName(entry, 'link')[0]?.getAttribute('href');
                        const title = getElementsByLocalName(entry, 'title')[0]?.textContent || "";
                        if (link) {
                            allFeedData.push({
                                title, 
                                updated: new Date(getElementsByLocalName(entry, 'updated')[0]?.textContent),
                                author: getElementsByLocalName(getElementsByLocalName(entry, 'author')[0], 'name')[0]?.textContent,
                                link
                            });
                        }
                    });
                }
                
                const seen = new Set();
                allFeedData = allFeedData.filter(item => {
                    const key = item.title + item.author;
                    if (seen.has(key)) return false;
                    seen.add(key);
                    return true;
                });

                msg.innerText = "各エリアのXMLデータを解析中...";

                const scanPromises = allFeedData.map(async item => {
                    try {
                        const res = await fetch(item.link);
                        const xmlText = await res.text();
                        xmlDocs[item.link] = xmlText; 
                        
                        const xml = new DOMParser().parseFromString(xmlText, "text/xml");
                        const risksFound = [];
                        
                        // XML内の時系列情報(時間定義)および各警報リスク情報をパースして保持
                        const timeSeriesList = getElementsByLocalName(xml, 'TimeSeriesInfo');
                        const timeDefines = getElementsByLocalName(xml, 'TimeDefine');
                        const timeDefinesMap = {};
                        timeDefines.forEach(td => {
                            const id = td.getAttribute('timeId');
                            let name = getElementsByLocalName(td, 'Name')[0]?.textContent;
                            const dtStr = getElementsByLocalName(td, 'DateTime')[0]?.textContent;
                            let timestamp = 0;
                            if (dtStr) {
                                timestamp = new Date(dtStr).getTime();
                            }
                            if (!name) {
                                // 週間早期注意情報などNameがない場合、DateTimeから日付名を作る
                                if(dtStr) {
                                    const d = new Date(dtStr);
                                    name = `${d.getMonth() + 1}/${d.getDate()}(${['日','月','火','水','木','金','土'][d.getDay()]})`;
                                } else {
                                    name = "日時不明";
                                }
                            }
                            timeDefinesMap[id] = { name, timestamp };
                        });

                        const kinds = getElementsByLocalName(xml, 'Kind');
                        kinds.forEach(kind => {
                            const prop = getElementsByLocalName(kind, 'Property')[0];
                            const rawType = prop ? getElementsByLocalName(prop, 'Type')[0]?.textContent : null;
                            const typeName = TYPE_NAME_MAP[rawType] || rawType;
                            if (!typeName) return;

                            const rankNodes = getElementsByLocalName(kind, 'PossibilityRankOfWarning');
                            rankNodes.forEach(rank => {
                                let condAttr = rank.getAttribute('condition');
                                let textCond = rank.textContent.trim();
                                let val = (condAttr && condAttr !== '値なし') ? condAttr : textCond;
                                const refID = rank.getAttribute('refID');
                                
                                let rVal = 'なし';
                                if (val === '高い' || val === '高' || val === '[高]') {
                                    rVal = '高';
                                    risksFound.push({ type: typeName, rank: '高' });
                                } else if (val === '中程度' || val === '中' || val === '[中]') {
                                    rVal = '中';
                                    risksFound.push({ type: typeName, rank: '中' });
                                }

                                // キャッシュへ保持する構造を格納
                                // 該当Itemが属するArea情報をたどる
                                let parent = rank.parentNode;
                                while(parent && parent.localName !== 'Item') parent = parent.parentNode;
                                if (parent) {
                                    const areaNode = getElementsByLocalName(parent, 'Area')[0];
                                    const areaName = areaNode ? getElementsByLocalName(areaNode, 'Name')[0]?.textContent || "" : "";
                                    
                                    // 都道府県をマッチング
                                    Object.keys(PREF_MAP).forEach(prefId => {
                                        const prefName = PREF_MAP[prefId];
                                        let targetRegion = null;
                                        for (const group of REGION_GROUPS) {
                                            const r = group.regions.find(reg => reg.name === prefName);
                                            if (r) { targetRegion = r; break; }
                                        }

                                        if (targetRegion && targetRegion.keywords.some(k => item.author && item.author.includes(k) || item.title && item.title.includes(k))) {
                                            if (!prefFullDataCache[prefId]) prefFullDataCache[prefId] = { riskByKind: {}, riskByTime: {} };
                                            
                                            // 種類別の最高リスク
                                            if (!prefFullDataCache[prefId].riskByKind[typeName]) prefFullDataCache[prefId].riskByKind[typeName] = 'なし';
                                            if (rVal === '高') prefFullDataCache[prefId].riskByKind[typeName] = '高';
                                            else if (rVal === '中' && prefFullDataCache[prefId].riskByKind[typeName] !== '高') prefFullDataCache[prefId].riskByKind[typeName] = '中';

                                            // 時間帯別の最高リスク (DateTimeから自動生成された日付フォーマットでも登録される)
                                            const timeInfo = timeDefinesMap[refID];
                                            if (timeInfo) {
                                                const timeName = timeInfo.name;
                                                const timestamp = timeInfo.timestamp;
                                                const timeKey = `${timeName}_${typeName}`;
                                                if (!prefFullDataCache[prefId].riskByTime[timeKey]) {
                                                    prefFullDataCache[prefId].riskByTime[timeKey] = { rank: 'なし', timestamp };
                                                }
                                                if (rVal === '高') {
                                                    prefFullDataCache[prefId].riskByTime[timeKey].rank = '高';
                                                } else if (rVal === '中' && prefFullDataCache[prefId].riskByTime[timeKey].rank !== '高') {
                                                    prefFullDataCache[prefId].riskByTime[timeKey].rank = '中';
                                                }
                                            }
                                        }
                                    });
                                }
                            });
                        });
                        globalRisks[item.link] = risksFound;
                    } catch (e) {}
                });
                await Promise.all(scanPromises);

                const lastUpdateEl = document.getElementById('lastUpdate');
                if (lastUpdateEl) lastUpdateEl.innerText = new Date().toLocaleTimeString('ja-JP') + " 更新";

                initMap();
                renderListView();
                renderMatrixTable();
                switchView('map');

                overlay.style.opacity = '0';
                setTimeout(() => overlay.style.display = 'none', 500);

            } catch (e) {
                msg.innerHTML = `<span class="text-red-500 font-bold">システムエラー: ${e.message}</span>`;
            }
        }

        // --- 全国一括タイムラインマトリックスビュー描画機能（空欄自動省略・幅自動調整搭載） ---
        window.renderMatrixTable = function() {
            const header = document.getElementById('matrixHeader');
            const body = document.getElementById('matrixBody');
            
            if (!header || !body) return;

            // 1. 全都道府県のキャッシュから時間帯名とタイムスタンプを紐づけて収集
            const timeMap = {}; // { timeName: timestamp }
            Object.keys(prefFullDataCache).forEach(prefId => {
                const cache = prefFullDataCache[prefId];
                if (cache && cache.riskByTime) {
                    Object.keys(cache.riskByTime).forEach(key => {
                        const parts = key.split('_'); // [timeName, typeName]
                        const timeName = parts[0];
                        const data = cache.riskByTime[key];
                        if (timeName && data && data.timestamp) {
                            if (!timeMap[timeName] || timeMap[timeName] === 0) {
                                timeMap[timeName] = data.timestamp;
                            }
                        }
                    });
                }
            });

            // タイムスタンプ順（昇順）で完全にソート
            const sortedTimeNames = Object.keys(timeMap).sort((a, b) => {
                const diff = (timeMap[a] || 0) - (timeMap[b] || 0);
                if (diff !== 0) return diff;
                return a.localeCompare(b, 'ja');
            });

            // 時間帯が1つも無い場合の処理
            if (sortedTimeNames.length === 0) {
                header.innerHTML = `
                    <tr>
                        <th class="matrix-sticky-corner p-2 text-slate-700 text-left">警報種別</th>
                        <th class="p-2 text-slate-400 font-bold text-center">時系列データ予測情報なし</th>
                    </tr>
                `;
                body.innerHTML = `
                    <tr>
                        <td class="matrix-sticky-col p-2 text-left text-slate-500 font-black">全種別</td>
                        <td class="p-6 text-slate-400 font-bold bg-slate-50">
                            現在、全国で警報級リスク（高・中）の時系列予測データはありません。
                        </td>
                    </tr>
                `;
                return;
            }

            // 2. 各時間帯が「リスクあり（全国のいずれかの県で高または中）」か「完全な空欄」かを解析
            const timeMapRiskStatus = {};
            sortedTimeNames.forEach(t => {
                let hasRisk = false;
                SORT_ORDER_RANK.forEach(kind => {
                    Object.keys(PREF_MAP).forEach(prefId => {
                        const cache = prefFullDataCache[prefId];
                        if (cache && cache.riskByTime) {
                            const key = `${t}_${kind}`;
                            const valObj = cache.riskByTime[key];
                            const val = valObj ? valObj.rank : 'なし';
                            if (val === '高' || val === '中') {
                                hasRisk = true;
                            }
                        }
                    });
                });
                timeMapRiskStatus[t] = hasRisk;
            });

            // 3. 表示カラムの構成を作る (空欄の時間帯が連続する場合は「〜〜〜」に圧縮・省略してまとめる)
            const displayColumns = [];
            let pendingOmitted = [];

            sortedTimeNames.forEach(t => {
                const hasRisk = timeMapRiskStatus[t];
                if (hasRisk) {
                    if (pendingOmitted.length > 0) {
                        displayColumns.push({
                            type: 'omitted',
                            label: '〜〜〜',
                            tooltip: pendingOmitted.join(' / ') + ' は警報級の可能性なし',
                            times: [...pendingOmitted]
                        });
                        pendingOmitted = [];
                    }
                    displayColumns.push({
                        type: 'active',
                        label: t,
                        time: t
                    });
                } else {
                    pendingOmitted.push(t);
                }
            });

            if (pendingOmitted.length > 0) {
                displayColumns.push({
                    type: 'omitted',
                    label: '〜〜〜',
                    tooltip: pendingOmitted.join(' / ') + ' は警報級の可能性なし',
                    times: [...pendingOmitted]
                });
            }

            // 【ヘッダー生成】(横スクロールを徹底排除しつつ、省略カラムは極小に自動割り振り、アクティブカラムは十分な可変幅に自動調整)
            header.innerHTML = `
                <tr>
                    <th class="matrix-sticky-corner p-1.5 w-[55px] md:w-[80px] font-black text-slate-800 text-left bg-slate-100 border-b border-r border-slate-200 text-[8px] md:text-[10px] whitespace-nowrap">
                        警報種別
                    </th>
                    ${displayColumns.map(col => {
                        if (col.type === 'active') {
                            // アクティブ列：極小表示を徹底
                            let compactTime = col.label
                                .replace(/から/g, '〜')
                                .replace(/明け方/g, '明け')
                                .replace(/朝から夕方/g, '朝-夕')
                                .replace(/夕方から夜のはじめ頃/g, '夕-夜')
                                .replace(/夜のはじめ頃から夜遅く/g, '夜')
                                .replace(/午前中/g, '午前')
                                .replace(/午後/g, '午後');
                            return `
                                <th class="p-1.5 font-black text-slate-700 bg-slate-50 leading-tight border-b border-r border-slate-200 text-[8px] md:text-[9px] break-words">
                                    ${compactTime}
                                </th>
                            `;
                        } else {
                            // 省略列：非常に細い（w-[22px]〜w-[30px]）固定幅を定義し、平穏であることを示す
                            return `
                                <th class="p-1 w-[22px] md:w-[30px] font-extrabold text-slate-400 bg-slate-100 border-b border-r border-slate-200 text-[8px] md:text-[9px] text-center whitespace-nowrap" title="${col.tooltip}">
                                    ${col.label}
                                </th>
                            `;
                        }
                    }).join('')}
                </tr>
            `;

            // 【ボディ生成】(縦軸に警報種別、交点に都道府県リスト)
            let bodyHtml = "";
            SORT_ORDER_RANK.forEach(kind => {
                bodyHtml += `
                    <tr class="hover:bg-slate-50/50 transition-colors">
                        <!-- 縦軸ラベル: 警報種別 (幅をスマートに制限) -->
                        <td class="matrix-sticky-col p-1.5 text-left text-[9px] md:text-xs text-slate-800 font-black bg-white shadow-[1px_0_0_#e2e8f0] border-b border-slate-200 w-[55px] md:w-[80px] whitespace-nowrap">
                            ${kind}
                        </td>
                        <!-- 横軸: カラムタイプに応じてアクティブバッジ、または省略ブロックを描画 -->
                        ${displayColumns.map(col => {
                            if (col.type === 'active') {
                                const t = col.time;
                                const highPrefs = [];
                                const midPrefs = [];

                                // 全都道府県をチェック
                                Object.keys(PREF_MAP).forEach(prefId => {
                                    const prefName = PREF_MAP[prefId];
                                    const cache = prefFullDataCache[prefId];
                                    if (cache && cache.riskByTime) {
                                        const key = `${t}_${kind}`;
                                        const valObj = cache.riskByTime[key];
                                        const val = valObj ? valObj.rank : 'なし';
                                        const shortName = prefName.replace(/[都府県]$/, ''); // 短縮名にしてカードを極小化
                                        
                                        if (val === '高') {
                                            highPrefs.push({ id: prefId, name: shortName });
                                        } else if (val === '中') {
                                            midPrefs.push({ id: prefId, name: shortName });
                                        }
                                    }
                                });

                                let cellHtml = "";
                                if (highPrefs.length === 0 && midPrefs.length === 0) {
                                    cellHtml = `<span class="text-slate-300 font-bold text-[8px]">―</span>`;
                                } else {
                                    // バッジが入り切らない場合は自動で下に改行
                                    cellHtml = `<div class="matrix-cell-container">`;
                                    
                                    // 高リスク（赤色極小バッジ）
                                    highPrefs.forEach(p => {
                                        cellHtml += `
                                            <button onclick="showPrefDetail('${p.id}')" class="bg-red-600 hover:bg-red-700 text-white text-[8px] md:text-[9px] font-black px-1.5 py-0.5 rounded shadow-[0_1px_1px_rgba(220,38,38,0.15)] transition-all shrink-0">
                                                ${p.name}
                                            </button>
                                        `;
                                    });

                                    // 中リスク（ピンク色極小バッジ）
                                    midPrefs.forEach(p => {
                                        cellHtml += `
                                            <button onclick="showPrefDetail('${p.id}')" class="bg-red-100 hover:bg-red-200 text-red-900 text-[8px] md:text-[9px] font-black px-1.5 py-0.5 rounded border border-red-200 transition-all shrink-0">
                                                ${p.name}
                                            </button>
                                        `;
                                    });

                                    cellHtml += `</div>`;
                                }
                                
                                // 背景色のニュアンス付け
                                let bgClass = "bg-white";
                                if (highPrefs.length > 0) bgClass = "bg-red-50/10";
                                else if (midPrefs.length > 0) bgClass = "bg-amber-50/5";

                                return `
                                    <td class="p-1 text-center border-b border-r border-slate-200 ${bgClass}">
                                        ${cellHtml}
                                    </td>
                                `;
                            } else {
                                // 省略された列（全国ですべて「発表なし」の時間帯）
                                return `
                                    <td class="p-1 text-center border-b border-r border-slate-200 bg-slate-50/50 text-slate-300 font-bold text-[8px] w-[22px] md:w-[30px] whitespace-nowrap">
                                        ―
                                    </td>
                                `;
                            }
                        }).join('')}
                    </tr>
                `;
            });
            body.innerHTML = bodyHtml;
        };

        function getAggregatedRisksForRegion(region) {
            const allRisks = [];
            allFeedData.forEach(item => {
                if (region.keywords.some(k => item.author && item.author.includes(k) || item.title && item.title.includes(k))) {
                    if (globalRisks[item.link]) allRisks.push(...globalRisks[item.link]);
                }
            });
            return allRisks;
        }

        function getPrefRiskScore(prefName) {
            if (!prefName) return 0;
            let targetRegion = null;
            for (const group of REGION_GROUPS) {
                const region = group.regions.find(r => r.name === prefName);
                if (region) { targetRegion = region; break; }
            }
            if (!targetRegion) return 0;
            
            const risks = getAggregatedRisksForRegion(targetRegion);
            let maxScore = 0;
            for (const r of risks) {
                if (r.rank === '高') maxScore = 2;
                else if (r.rank === '中' && maxScore < 2) maxScore = 1;
            }
            return maxScore;
        }

        function getRiskSummary() {
            const summary = [];
            Object.keys(PREF_MAP).forEach(id => {
                const prefName = PREF_MAP[id];
                let targetRegion = null;
                for (const group of REGION_GROUPS) {
                    const region = group.regions.find(r => r.name === prefName);
                    if (region) { targetRegion = region; break; }
                }
                
                if (targetRegion) {
                    const risks = getAggregatedRisksForRegion(targetRegion);
                    const riskMap = {};
                    risks.forEach(r => {
                        if (!riskMap[r.type]) {
                            riskMap[r.type] = r.rank;
                        } else {
                            if (r.rank === '高') riskMap[r.type] = '高';
                        }
                    });
                    
                    const riskKeys = Object.keys(riskMap);
                    if (riskKeys.length > 0) {
                        summary.push({
                            id,
                            name: prefName,
                            risks: riskKeys.map(k => ({ type: k, rank: riskMap[k] }))
                        });
                    }
                }
            });
            
            summary.sort((a, b) => {
                const maxScoreA = a.risks.some(r => r.rank === '高') ? 2 : 1;
                const maxScoreB = b.risks.some(r => r.rank === '高') ? 2 : 1;
                if (maxScoreA !== maxScoreB) return maxScoreB - maxScoreA;
                return a.id.localeCompare(b.id);
            });
            
            return summary;
        }

        function getLevelColor(score) {
            if (score === 2) return "#dc2626"; 
            if (score === 1) return "#fca5a5"; 
            return "#ffffff"; 
        }

        function initMap() {
            if (!map) {
                map = L.map('map', { zoomSnap: 0.1, attributionControl: false }).setView([38, 137], window.innerWidth < 640 ? 4.5 : 5.2);
            }
            renderMapLayers();
        }

        function renderMapLayers() {
            if (!map || !japanGeoData) return;
            if (mainPrefLayer) map.removeLayer(mainPrefLayer);

            mainPrefLayer = L.geoJson(japanGeoData, {
                smoothFactor: 0,
                style: (f) => {
                    const id = f.properties.id ? String(f.properties.id).padStart(2, "0") : (f.properties.pref ? String(f.properties.pref).padStart(2, "0") : "");
                    const prefName = PREF_MAP[id];
                    const score = getPrefRiskScore(prefName);
                    const isSelected = selectedPrefId === id;
                    
                    return {
                        fillColor: getLevelColor(score),
                        fillOpacity: 1, 
                        weight: isSelected ? 3 : 1,
                        color: isSelected ? "#1d4ed8" : "#cbd5e1",
                        opacity: 1,
                        fill: true
                    };
                },
                onEachFeature: (f, layer) => {
                    const id = f.properties.id ? String(f.properties.id).padStart(2, "0") : (f.properties.pref ? String(f.properties.pref).padStart(2, "0") : "");
                    const prefName = PREF_MAP[id];

                    layer.bindTooltip(`<b>${prefName || "不明"}</b>`, {
                        sticky: true, direction: "auto", className: "font-sans text-xs bg-white/95 px-2 py-1 border border-slate-200 rounded shadow-sm"
                    });

                    layer.on('click', () => {
                        if(id) {
                            selectedPrefId = id;
                            renderMapLayers();
                            if (layer.getBounds && layer.getBounds().isValid()) {
                                map.fitBounds(layer.getBounds(), { padding: [50, 50] });
                            }
                            showPrefDetail(id);
                        }
                    });
                }
            }).addTo(map);
        }

        function highlightNumbers(text) {
            return text.replace(/([０-９0-9]+(?:．[０-９0-9]+|\.[0-9]+)?)/g, '<span class="number-highlight">$1</span>');
        }

        function formatDetailText(text) {
            if (!text) return "";
            let s = text;
            s = s.replace(/陸上([０-９0-9．.]+)メートル(?:以下)?[　\s]*海上(?:では)?([０-９0-9．.]+)メートル(?:以下)?/g, (match, p1, p2) => {
                if (p1 === p2) return `陸・海 ${p1}m以下`;
                return `陸 ${p1}m以下 / 海 ${p2}m以下`;
            });
            s = s.replace(/メートル/g, 'm');
            s = s.replace(/センチ/g, 'cm');
            s = s.replace(/ミリ/g, 'mm');
            s = s.replace(/キロメートル/g, 'km');
            s = s.replace(/海上では/g, '海 ');
            s = s.replace(/陸上/g, '陸 ');
            s = s.replace(/　/g, ' ');
            return highlightNumbers(s);
        }

        function getDirectTextContent(node) {
            let text = "";
            if (!node) return text;
            node.childNodes.forEach(n => {
                if (n.nodeType === 3) text += n.nodeValue; 
            });
            return text.trim();
        }

        function generateAnalysisHtml(doc, titleText) {
            const isWarningRisk = titleText.includes("警報級の可能性") || titleText.includes("早期注意情報");

            if (!isWarningRisk) {
                let headlineText = "";
                const headlineNodes = getElementsByLocalName(doc, 'Headline');
                if (headlineNodes.length > 0) {
                    const textNodes = getElementsByLocalName(headlineNodes[0], 'Text');
                    if (textNodes.length > 0) headlineText = textNodes[0].textContent.trim();
                }
                
                if (!headlineText) {
                     const texts = getElementsByLocalName(doc, 'Text');
                     let longestText = "";
                     texts.forEach(t => {
                         const txt = t.textContent.trim();
                         if (txt.length > longestText.length) longestText = txt;
                     });
                     if (longestText.length > 10 && longestText.length < 1500) headlineText = longestText;
                }

                if (headlineText) {
                    return `
                    <div class="mb-6 p-5 sm:p-6 bg-white border border-slate-200 rounded-[1.5rem] shadow-sm">

                            <i data-lucide="file-text" class="w-4 h-4 text-blue-500"></i> ${titleText}
                        </h4>
                        <div class="bg-slate-50 p-4 rounded-xl text-xs text-slate-700 leading-loose font-medium whitespace-pre-wrap max-h-[350px] overflow-y-auto custom-scrollbar border border-slate-200 shadow-inner">
                            ${headlineText}
                        </div>
                    </div>`;
                } else {
                    return `
