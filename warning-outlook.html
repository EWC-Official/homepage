                        <h4 class="text-xs font-black tracking-tight text-slate-800 flex items-center gap-2">
                            <i data-lucide="file-text" class="w-4 h-4 text-slate-400"></i> ${titleText}
                        </h4>
                        <p class="text-[10px] text-slate-500 mt-2 font-bold">※この電文は詳細表示に未対応です（RAWデータタブから確認できます）</p>
                    </div>`;
                }
            }

            let html = "";
            
            // --- 1. 日別最大予測 ---
            const metInfos = getElementsByLocalName(doc, 'MeteorologicalInfo');
            if (metInfos.length > 0) {
                let hasValidMetInfo = false;
                let metInfoHtml = `<div class="mb-6">
                    <h4 class="text-xs font-black text-slate-500 mb-3 flex items-center gap-1.5 uppercase tracking-widest"><i data-lucide="calendar-check-2" class="w-4 h-4"></i> 日別最大予測</h4>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">`;
                
                metInfos.forEach(info => {
                    const dateName = getElementsByLocalName(info, 'Name')[0]?.textContent || "";
                    const items = getElementsByLocalName(info, 'Item');
                    
                    items.forEach(item => {
                        const areaNode = getElementsByLocalName(item, 'Area')[0];
                        const areaName = areaNode ? getElementsByLocalName(areaNode, 'Name')[0]?.textContent || "" : "";
                        
                        let itemHtml = `<div class="bg-blue-50/60 border border-blue-100 rounded-2xl p-4 shadow-sm relative overflow-hidden">
                            <div class="absolute top-0 left-0 w-1 h-full bg-blue-400"></div>
                            <div class="text-[10px] font-black text-blue-500 mb-2.5 tracking-wider">${dateName} - ${areaName}</div>
                            <div class="space-y-2">`;
                        
                        let kindsData = [];
                        const kinds = getElementsByLocalName(item, 'Kind');
                        kinds.forEach(kind => {
                            const prop = getElementsByLocalName(kind, 'Property')[0];
                            const type = prop ? getElementsByLocalName(prop, 'Type')[0]?.textContent || "" : "";
                            
                            let val = "";
                            const detailForecasts = getElementsByLocalName(kind, 'DetailForecast');
                            if (detailForecasts.length > 0) {
                                const firstPart = detailForecasts[0].children[0];
                                if (firstPart) {
                                    const baseNodes = Array.from(firstPart.children).filter(c => c.localName === 'Base');
                                    if (baseNodes.length > 0) {
                                        const valNodes = Array.from(baseNodes[0].children);
                                        if (valNodes.length > 0) {
                                            const condition = valNodes[0].getAttribute('condition');
                                            const description = valNodes[0].getAttribute('description');
                                            const unit = valNodes[0].getAttribute('unit');
                                            const textVal = getDirectTextContent(valNodes[0]);
                                            
                                            if (description && description !== '値なし') val = description + (unit ? unit : "");
                                            else if (textVal) val = textVal + (unit ? unit : "");
                                            else if (condition && condition !== '値なし') val = condition;
                                        }
                                    }
                                    if(!val) {
                                         const sentenceNode = getElementsByLocalName(firstPart, 'Sentence')[0];
                                         val = sentenceNode ? sentenceNode.textContent.trim() : "";
                                    }
                                }
                            }
                            
                            if (type && val) kindsData.push({ type, val });
                        });

                        kindsData.sort((a, b) => getSortIndex(a.type, SORT_ORDER_SUMMARY) - getSortIndex(b.type, SORT_ORDER_SUMMARY));

                        let hasData = kindsData.length > 0;
                        kindsData.forEach(d => {
                            itemHtml += `<div class="flex justify-between items-end text-xs border-b border-blue-200/50 pb-1.5">
                                <span class="text-slate-600 font-bold">${d.type}</span>
                                <span class="font-bold text-slate-800 text-right">${formatDetailText(d.val)}</span>
                            </div>`;
                        });
                        
                        if(hasData) {
                            itemHtml += `</div></div>`;
                            metInfoHtml += itemHtml;
                            hasValidMetInfo = true;
                        }
                    });
                });
                metInfoHtml += `</div></div>`;
                if(hasValidMetInfo) html += metInfoHtml;
            }

            // --- 2. タイムシリーズ解析 ---
            const timeSeriesList = getElementsByLocalName(doc, 'TimeSeriesInfo');
            
            timeSeriesList.forEach((ts, tsIndex) => {
                const timeDefinesMap = {};
                const timeDefineIds = [];
                const timeDefines = getElementsByLocalName(ts, 'TimeDefine');
                
                timeDefines.forEach(td => {
                    const id = td.getAttribute('timeId');
                    let name = getElementsByLocalName(td, 'Name')[0]?.textContent;
                    if (!name) {
                        const dtStr = getElementsByLocalName(td, 'DateTime')[0]?.textContent;
                        if(dtStr) {
                            const d = new Date(dtStr);
                            name = `${d.getMonth() + 1}/${d.getDate()}(${['日','月','火','水','木','金','土'][d.getDay()]})`;
                        } else name = "日時不明";
                    }
                    timeDefinesMap[id] = name;
                    if (!timeDefineIds.includes(id)) timeDefineIds.push(id);
                });

                const areaData = {};
                const items = getElementsByLocalName(ts, 'Item');
                
                items.forEach(infoItem => {
                    const areaNode = getElementsByLocalName(infoItem, 'Area')[0];
                    const targetArea = areaNode ? getElementsByLocalName(areaNode, 'Name')[0]?.textContent || "対象区域" : "対象区域";
                    if (!areaData[targetArea]) areaData[targetArea] = { rankTypes: {}, detailTypes: {}, text: "" };
                    
                    const kinds = getElementsByLocalName(infoItem, 'Kind');
                    kinds.forEach(kind => {
                        const prop = getElementsByLocalName(kind, 'Property')[0];
                        const rawType = prop ? getElementsByLocalName(prop, 'Type')[0]?.textContent : null;
                        const typeName = TYPE_NAME_MAP[rawType] || rawType;
                        if (!typeName) return;

                        // ランク情報の抽出
                        const rankNodes = getElementsByLocalName(kind, 'PossibilityRankOfWarning');
                        if (rankNodes.length > 0) {
                            if (!areaData[targetArea].rankTypes[typeName]) areaData[targetArea].rankTypes[typeName] = {};
                            rankNodes.forEach(rank => {
                                let condAttr = rank.getAttribute('condition');
                                let textCond = rank.textContent.trim();
                                let val = (condAttr && condAttr !== '値なし') ? condAttr : textCond;
                                
                                let finalVal = 'なし';
                                if (val === '高い' || val === '高' || val === '[高]') finalVal = '高';
                                else if (val === '中程度' || val === '中' || val === '[中]') finalVal = '中';
                                else if (val && val !== '値なし') finalVal = val;
                                
                                areaData[targetArea].rankTypes[typeName][rank.getAttribute('refID')] = finalVal;
                            });
                        }

                        // 詳細予測値の抽出 (Base要素およびSubArea要素対応の高度化)
                        const detailForecasts = getElementsByLocalName(kind, 'DetailForecast');
                        detailForecasts.forEach(df => {
                            const parts = Array.from(df.children);
                            parts.forEach(f => {
                                const refID = f.getAttribute('refID');
                                if (!refID) return;

                                const processBase = (baseNode, prefixAreaName = "") => {
                                    const locals = getElementsByLocalName(baseNode, 'Local');
                                    if (locals.length > 0) {
                                        locals.forEach(local => {
                                            const areaNameNode = getElementsByLocalName(local, 'AreaName')[0];
                                            const localAreaName = areaNameNode ? areaNameNode.textContent : "";
                                            const valNodes = Array.from(local.children).filter(n => n.localName !== 'AreaName');
                                            if (valNodes.length > 0) {
                                                extractAndSet(valNodes[0], prefixAreaName + (localAreaName ? `（${localAreaName}）` : ""));
                                            }
                                        });
                                    } else {
                                        const valNodes = Array.from(baseNode.children);
                                        if (valNodes.length > 0) {
                                            extractAndSet(valNodes[0], prefixAreaName);
                                        }
                                    }
                                };

                                const extractAndSet = (valNode, suffix) => {
                                    const condition = valNode.getAttribute('condition');
                                    const description = valNode.getAttribute('description');
                                    const unit = valNode.getAttribute('unit');
                                    const textVal = getDirectTextContent(valNode);
                                    
                                    let val = "";
                                    if (description && description !== '値なし') val = description + (unit ? unit : "");
                                    else if (textVal) textVal + (unit ? unit : "");
                                    else if (condition && condition !== '値なし') val = condition;

                                    const detailTypeKey = rawType + suffix;
                                    if (!areaData[targetArea].detailTypes[detailTypeKey]) areaData[targetArea].detailTypes[detailTypeKey] = {};
                                    areaData[targetArea].detailTypes[detailTypeKey][refID] = val;
                                };

                                let hasBase = false;
                                Array.from(f.children).forEach(child => {
                                    if (child.localName === 'Base') {
                                        processBase(child, "");
                                        hasBase = true;
                                    } else if (child.localName === 'SubArea') {
                                        const subAreaNameNode = getElementsByLocalName(child, 'AreaName')[0];
                                        const subAreaName = subAreaNameNode ? subAreaNameNode.textContent : "";
                                        const subBases = getElementsByLocalName(child, 'Base');
                                        subBases.forEach(subBase => {
                                            processBase(subBase, subAreaName ? `（${subAreaName}）` : "");
                                            hasBase = true;
                                        });
                                    }
                                });

                                if (!hasBase) {
                                    const sentenceNode = getElementsByLocalName(f, 'Sentence')[0];
                                    const val = sentenceNode ? sentenceNode.textContent.trim() : "";
                                    if (!areaData[targetArea].detailTypes[rawType]) areaData[targetArea].detailTypes[rawType] = {};
                                    areaData[targetArea].detailTypes[rawType][refID] = val;
                                }
                            });
                        });
                        
                        // 補足テキストの抽出
                        if (prop) {
                            const textNode = getElementsByLocalName(prop, 'Text')[0];
                            if (textNode) {
                                const kindText = textNode.textContent;
                                if (kindText && !areaData[targetArea].text.includes(kindText)) {
                                    areaData[targetArea].text += (areaData[targetArea].text ? "\n" : "") + kindText;
                                }
                            }
                        }
                    });
                });

                // エリアごとにHTML生成
                for (const [areaName, data] of Object.entries(areaData)) {
                    
                    let highestRank = 'なし';
                    for (const type in data.rankTypes) {
                        for (const tid in data.rankTypes[type]) {
                            const rank = data.rankTypes[type][tid];
                            if (rank === '高') highestRank = '高';
                            else if (rank === '中' && highestRank !== '高') highestRank = '中';
                        }
                    }

                    let badgeHtml = '';
                    if (highestRank === '高') {
                        badgeHtml = '<span class="ml-3 align-middle bg-red-600 text-white text-[10px] px-2 py-0.5 rounded-full font-bold shadow-sm inline-flex items-center gap-1"><i data-lucide="alert-triangle" class="w-3 h-3"></i> 警報級(高)</span>';
                    } else if (highestRank === '中') {
                        badgeHtml = '<span class="ml-3 align-middle bg-red-200 text-red-900 text-[10px] px-2 py-0.5 rounded-full font-bold shadow-sm inline-flex items-center gap-1">警報級(中)</span>';
                    }

                    let sectionHtml = `<div class="mb-10"><h3 class="text-xl font-black text-slate-900 mb-5 border-l-4 border-slate-800 pl-3 leading-none flex items-center">${areaName}${badgeHtml}</h3>`;
                    
                    // --- ランクテーブル ---
                    let rankKeys = Object.keys(data.rankTypes);
                    rankKeys.sort((a, b) => getSortIndex(a, SORT_ORDER_RANK) - getSortIndex(b, SORT_ORDER_RANK));

                    if (rankKeys.length > 0) {
                        const activeTimeIds = timeDefineIds.filter(tid => rankKeys.some(type => tid in data.rankTypes[type]));
                        if (activeTimeIds.length > 0) {
                            sectionHtml += `<div class="mb-6">
                                <div class="text-[10px] font-black text-slate-500 mb-2 uppercase tracking-widest flex items-center gap-1.5"><i data-lucide="alert-triangle" class="w-3.5 h-3.5 text-red-500"></i> 警報級の可能性（リスク）</div>
                                <div class="overflow-x-auto rounded-2xl border border-slate-200 bg-white shadow-sm custom-scrollbar">
                                <table class="analysis-table w-full min-w-max text-xs">
                                <thead><tr class="bg-slate-50/80 border-b border-slate-200">
                                <th class="py-3 px-4 font-black text-slate-800 text-left sticky left-0 z-10 bg-slate-50 shadow-[1px_0_0_#e2e8f0]">種類</th>
                                ${activeTimeIds.map(tid => `<th class="py-3 px-4 font-bold text-slate-600 text-center leading-tight whitespace-nowrap min-w-[80px]">${timeDefinesMap[tid]}</th>`).join('')}
                                </tr></thead><tbody class="divide-y divide-slate-100">`;
                            
                            rankKeys.forEach(typeName => {
                                sectionHtml += `<tr class="hover:bg-slate-50/50 transition-colors"><td class="py-3.5 px-4 font-black text-slate-800 sticky left-0 z-10 bg-white shadow-[1px_0_0_#f1f5f9] group-hover:bg-slate-50/50 transition-colors">${typeName}</td>`;
                                activeTimeIds.forEach(tid => {
                                    const val = data.rankTypes[typeName][tid] || "なし";
                                    let display = `<span class="rank-text-none">―</span>`;
                                    if (val === '高') display = `<span class="rank-high">高</span>`;
                                    else if (val === '中') display = `<span class="rank-mid">中</span>`;
                                    else if (val !== 'なし' && val !== '') display = `<span class="text-slate-800 font-bold">${val}</span>`;
                                    sectionHtml += `<td class="py-3.5 px-4 text-center">${display}</td>`;
                                });
                                sectionHtml += `</tr>`;
                            });
                            sectionHtml += `</tbody></table></div></div>`;
                        }
                    }

                    // --- 詳細予測テーブル ---
                    let detailKeys = Object.keys(data.detailTypes);
                    detailKeys.sort((a, b) => getSortIndex(a, SORT_ORDER_DETAIL) - getSortIndex(b, SORT_ORDER_DETAIL));

                    if (detailKeys.length > 0) {
                        const activeTimeIds = timeDefineIds.filter(tid => detailKeys.some(type => tid in data.detailTypes[type]));
                        if (activeTimeIds.length > 0) {
                            sectionHtml += `<div class="mb-4">
                                <div class="text-[10px] font-black text-slate-500 mb-2 uppercase tracking-widest flex items-center gap-1.5"><i data-lucide="bar-chart-2" class="w-3.5 h-3.5 text-blue-500"></i> 詳細予測値</div>
                                <div class="overflow-x-auto rounded-2xl border border-slate-200 bg-white shadow-sm custom-scrollbar">
                                <table class="analysis-table w-full min-w-max text-xs">
                                <thead><tr class="bg-[#f0f9ff] border-b border-slate-200">
                                <th class="py-3 px-4 font-black text-slate-800 text-left sticky left-0 z-10 bg-[#f0f9ff] shadow-[1px_0_0_#e2e8f0]">予測項目</th>
                                ${activeTimeIds.map(tid => `<th class="py-3 px-4 font-bold text-slate-600 text-center leading-tight whitespace-nowrap min-w-[100px]">${timeDefinesMap[tid].replace(/から/g, '<br>〜')}</th>`).join('')}
                                </tr></thead><tbody class="divide-y divide-slate-100">`;
                            
                            detailKeys.forEach(typeName => {
                                sectionHtml += `<tr class="hover:bg-slate-50/50 transition-colors"><td class="py-3.5 px-4 font-black text-slate-700 sticky left-0 z-10 bg-white shadow-[1px_0_0_#f1f5f9] group-hover:bg-slate-50/50 transition-colors">${typeName}</td>`;
                                activeTimeIds.forEach(tid => {
                                    const val = data.detailTypes[typeName][tid];
                                    let display = `<span class="text-slate-300 font-bold">―</span>`;
                                    if (val) display = `<span class="text-slate-700 font-medium leading-relaxed">${formatDetailText(val)}</span>`;
                                    sectionHtml += `<td class="py-3.5 px-4 text-center">${display}</td>`;
                                });
                                sectionHtml += `</tr>`;
                            });
                            sectionHtml += `</tbody></table></div></div>`;
                        }
                    }

                    // --- 補足テキスト ---
                    if (data.text) {
                        sectionHtml += `<div class="p-4 bg-amber-50/80 border border-amber-200 rounded-[1.2rem] text-xs text-amber-900 leading-relaxed font-bold shadow-sm mt-4 flex gap-3 items-start"><i data-lucide="info" class="w-5 h-5 shrink-0 text-amber-600 mt-0.5"></i><div>${data.text.replace(/\n/g, '<br>')}</div></div>`;
                    }
                    
                    sectionHtml += `</div>`;
                    html += sectionHtml;
                }
            });
            
            if (html === "") return "";
            
            return `<div class="mb-10 p-5 sm:p-6 bg-white border border-slate-200 rounded-[2rem] shadow-sm"><h4 class="text-sm font-black tracking-tight mb-6 text-slate-800 pb-3 border-b border-slate-100 flex items-center gap-2"><i data-lucide="file-text" class="w-4 h-4 text-slate-400"></i> ${titleText}</h4>${html}</div>`;
        }

        function showPrefDetail(prefId) {
            const prefName = PREF_MAP[prefId];
            const detailTitle = document.getElementById('detailTitle');
            const detailContent = document.getElementById('detailContent');
            const rightPane = document.getElementById('rightPane');
            const leftPane = document.getElementById('leftPane');

            let targetRegion = null;
            for (const group of REGION_GROUPS) {
                const region = group.regions.find(r => r.name === prefName);
                if (region) { targetRegion = region; break; }
            }

            const matchingFeeds = allFeedData.filter(item => {
                return targetRegion && targetRegion.keywords.some(k => item.author && item.author.includes(k) || item.title && item.title.includes(k));
            });

            matchingFeeds.sort((a, b) => {
                const getScore = (title) => {
                    if (title.includes("警報級の可能性（明日まで）")) return 1;
                    if (title.includes("早期注意情報")) return 2;
                    if (title.includes("府県天気予報")) return 5;
                    return 10;
                };
                const scoreDiff = getScore(a.title) - getScore(b.title);
                if (scoreDiff !== 0) return scoreDiff;
                return (a.author || "").localeCompare(b.author || "", 'ja');
            });

            if (detailTitle) {
                let suffix = '';
                const uniqueAuthors = new Set(matchingFeeds.map(f => f.author).filter(Boolean));
                if (uniqueAuthors.size > 1) {
                    suffix = `<span class="text-xs text-slate-500 font-bold ml-2 align-middle">(${uniqueAuthors.size}区分)</span>`;
                }
                detailTitle.innerHTML = prefName + suffix;
            }

            let html = `<div class="space-y-6">`;

            if (matchingFeeds.length === 0) {
                html += `<div class="text-center py-12 text-xs text-slate-400 font-bold border border-dashed border-slate-300 rounded-[1.5rem] bg-white">この地域に対する警報級リスク予測情報はありません。</div>`;
            } else {
                matchingFeeds.forEach(feed => {
                    const xmlText = xmlDocs[feed.link];
                    if (xmlText) {
                        html += `<div class="relative">
                            <div class="mb-2 text-[10px] font-bold text-slate-500 flex items-center gap-2 px-1">
                                <span class="bg-slate-100 border border-slate-200 text-slate-600 px-2 py-0.5 rounded shadow-sm">${feed.author}</span>
                                <span>${feed.updated.toLocaleString('ja-JP')} 発表</span>
                            </div>`;
                        const doc = new DOMParser().parseFromString(xmlText, "text/xml");
                        html += generateAnalysisHtml(doc, feed.title);
                        html += `</div>`;
                    }
                });
            }

            const rawDataStr = matchingFeeds.map(f => `<!-- TITLE: ${f.title} \n     AUTHOR: ${f.author} \n     LINK: ${f.link} -->\n${xmlDocs[f.link] || ''}`).join('\n\n\n');
            
            html += `<div id="rawJsonArea" class="hidden mt-8">
                <div class="flex items-center justify-between bg-slate-800 text-slate-200 px-4 py-2 rounded-t-2xl text-[10px] font-mono border border-slate-700">
                    <span class="flex items-center gap-2"><i data-lucide="file-code" class="w-4 h-4 text-slate-400"></i> RAW XML DATA</span>
                    <button onclick="copyRawJson()" class="hover:text-white transition-colors bg-slate-700 px-3 py-1 rounded-lg">コピー</button>
                </div>
                <textarea id="rawTextArea" class="w-full h-[400px] bg-slate-900 text-green-400 font-mono text-[10px] p-5 rounded-b-2xl focus:outline-none border-t-0 border border-slate-800 custom-scrollbar block resize-none leading-relaxed shadow-inner" readonly>${escapeHtml(rawDataStr)}</textarea>
            </div>`;

            html += `</div>`;
            
            if (detailContent) detailContent.innerHTML = html;
            lucide.createIcons();

            if (rightPane) rightPane.classList.remove('translate-x-full');
            if (leftPane && window.innerWidth >= 768) {
                leftPane.classList.add('md:mr-[450px]', 'lg:mr-[550px]');
            } else {
                const backBtn = document.getElementById('headerBackButton');
                if (backBtn) backBtn.classList.remove('hidden');
                const viewToggle = document.getElementById('viewToggle');
                if (viewToggle) viewToggle.classList.add('hidden');
            }

            setTimeout(() => { if (map) map.invalidateSize(); }, 300);
        }

        function escapeHtml(unsafe) {
            return (unsafe || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        window.closeDetail = function() {
            const rightPane = document.getElementById('rightPane');
            const leftPane = document.getElementById('leftPane');

            if (rightPane) rightPane.classList.add('translate-x-full');
            if (leftPane) leftPane.classList.remove('md:mr-[450px]', 'lg:mr-[550px]');

            selectedPrefId = null;
            renderMapLayers();

            if (window.innerWidth < 768) {
                const viewToggle = document.getElementById('viewToggle');
                if (viewToggle) viewToggle.classList.remove('hidden');
                const backBtn = document.getElementById('headerBackButton');
                if (backBtn) backBtn.classList.add('hidden');
            }

            setTimeout(() => { if (map) map.invalidateSize(); }, 300);
        }

        window.handleGlobalBack = function() {
            closeDetail();
            if (map) map.setView([38, 137], window.innerWidth < 640 ? 4.5 : 5.2);
        }

        function renderListView() {
            const grid = document.getElementById('prefGrid');
            if (!grid) return;
            grid.innerHTML = '';

            const prefDataList = Object.keys(PREF_MAP).map(id => {
                const name = PREF_MAP[id];
                const score = getPrefRiskScore(name);
                let targetRegion = null;
                for (const group of REGION_GROUPS) {
                    const region = group.regions.find(r => r.name === name);
                    if (region) { targetRegion = region; break; }
                }
                const hasData = targetRegion && allFeedData.some(item => targetRegion.keywords.some(k => item.author && item.author.includes(k) || item.title && item.title.includes(k)));
                return { id, name, score, hasData };
            });

            prefDataList.sort((a, b) => {
                if (a.hasData && !b.hasData) return -1;
                if (!a.hasData && b.hasData) return 1;
                if (a.score !== b.score) return b.score - a.score;
                return a.id.localeCompare(b.id);
            });

            prefDataList.forEach(data => {
                const { id, name, score, hasData } = data;
                const card = document.createElement('div');

                if (hasData) {
                    card.className = "bg-white p-5 rounded-[1.5rem] border border-slate-200 shadow-sm hover:shadow-xl hover:border-blue-300 cursor-pointer group transition-all relative overflow-hidden";
                    card.onclick = () => {
                        selectedPrefId = id;
                        switchView('map');
                        showPrefDetail(id);
                        
                        if (japanGeoData && map) {
                            const targetPrefFeature = japanGeoData.features.find(f => {
                                const fid = f.properties.id ? String(f.properties.id).padStart(2, "0") : (f.properties.pref ? String(f.properties.pref).padStart(2, "0") : "");
                                return fid === id;
                            });
                            if (targetPrefFeature) {
                                map.fitBounds(L.geoJson(targetPrefFeature).getBounds(), { padding: [50, 50] });
                            }
                        }
                    };

                    const badgeHtml = score === 2 ? `<span class="bg-[#dc2626] text-white px-2 py-0.5 rounded-[4px] font-black text-[10px]">可能性 高</span>` : 
                                      score === 1 ? `<span class="bg-[#fca5a5] text-[#7f1d1d] px-2 py-0.5 rounded-[4px] font-black text-[10px]">可能性 中</span>` : 
                                      `<span class="border border-slate-200 text-slate-400 px-2 py-0.5 rounded-[4px] font-bold text-[10px]">予測なし</span>`;

                    card.innerHTML = `<div class="flex justify-between items-start mb-3">
                        <h3 class="text-lg font-black text-slate-800 group-hover:text-blue-600 transition-colors">${name}</h3>
                        ${badgeHtml}
                    </div>
                    <div class="flex items-center justify-between">
                        <p class="text-[10px] text-slate-400 font-bold">クリックして詳細を表示</p>
                        <i data-lucide="chevron-right" class="w-4 h-4 text-slate-200 group-hover:text-blue-600 group-hover:translate-x-1 transition-transform"></i>
                    </div>`;
                } else {
                    card.className = "bg-white p-5 rounded-[1.5rem] border border-slate-100 opacity-60";
                    card.innerHTML = `<h3 class="text-lg font-black text-slate-400 mb-1">${name}</h3>
                    <span class="text-[10px] font-bold text-slate-300">データなし</span>`;
                }

                grid.appendChild(card);
            });
            lucide.createIcons();
        }

        window.switchView = function(view) {
            const btnMap = document.getElementById('btnMap');
            const btnMatrix = document.getElementById('btnMatrix');
            const btnList = document.getElementById('btnList');
            
            const mapView = document.getElementById('mapView');
            const matrixView = document.getElementById('matrixView');
            const listView = document.getElementById('listView');

            const btns = [btnMap, btnMatrix, btnList];
            const views = [mapView, matrixView, listView];

            btns.forEach(btn => {
                if (btn) {
                    // hidden クラスは維持しながら、選択状態をコントロール
                    const isHidden = btn.classList.contains('hidden');
                    btn.className = "px-3 py-1.5 rounded-lg text-xs font-black transition-all text-slate-500 hover:text-slate-700 shrink-0" + (isHidden ? " hidden" : "");
                }
            });
            views.forEach(v => {
                if (v) v.classList.add('translate-x-full', 'opacity-0', 'pointer-events-none');
            });

            if (view === 'map') {
                if (btnMap) btnMap.className = "px-3 py-1.5 rounded-lg text-xs font-black transition-all bg-white text-blue-600 shadow-sm shrink-0";
                if (mapView) mapView.classList.remove('translate-x-full', 'opacity-0', 'pointer-events-none');
                setTimeout(() => { if (map) map.invalidateSize(); }, 300);
            } else if (view === 'matrix') {
                if (btnMatrix) btnMatrix.className = "px-3 py-1.5 rounded-lg text-xs font-black transition-all bg-white text-blue-600 shadow-sm shrink-0";
                if (matrixView) matrixView.classList.remove('translate-x-full', 'opacity-0', 'pointer-events-none');
                renderMatrixTable();
                closeDetail();
            } else {
                if (btnList) btnList.className = "px-3 py-1.5 rounded-lg text-xs font-black transition-all bg-white text-blue-600 shadow-sm shrink-0";
                if (listView) listView.classList.remove('translate-x-full', 'opacity-0', 'pointer-events-none');
                closeDetail();
            }
        }

        document.addEventListener('keydown', (e) => {
            if (e.key.toLowerCase() === 'f') {
                const rawJsonArea = document.getElementById('rawJsonArea');
                if (rawJsonArea) {
                    rawJsonArea.classList.toggle('hidden');
                    if (!rawJsonArea.classList.contains('hidden')) {
                        rawJsonArea.scrollIntoView({ behavior: 'smooth', block: 'start' });
                    }
                }
            }
            if (e.key.toLowerCase() === 'e') {
                showAllFeedsModal();
            }
            if (e.key.toLowerCase() === 'r') {
                showRiskListModal();
            }
        });

        window.showRiskListModal = function() {
            const modal = document.getElementById('riskListModal');
            const content = document.getElementById('riskListContent');
            const count = document.getElementById('riskCount');
            
            if (modal && content) {
                const summary = getRiskSummary();
                count.innerText = summary.length;
                
                if (summary.length === 0) {
                    content.innerHTML = `<div class="col-span-full text-center py-16 text-sm text-slate-500 font-bold bg-white border border-dashed border-slate-300 rounded-[1.5rem] shadow-sm"><i data-lucide="shield-check" class="w-12 h-12 text-emerald-400 mx-auto mb-4"></i>現在、全国で警報級の可能性（高・中）が発表されている地域はありません。</div>`;
                } else {
                    content.innerHTML = summary.map(item => {
                        const risksHtml = item.risks.map(r => {
                            const badgeClass = r.rank === '高' ? 'bg-red-600 text-white shadow-[0_2px_4px_rgba(220,38,38,0.2)]' : 'bg-red-200 text-red-900';
                            return `<span class="${badgeClass} px-2.5 py-1 rounded-[6px] font-black text-[11px] shrink-0 border border-transparent whitespace-nowrap">${r.type} (${r.rank})</span>`;
                        }).join('');
                        
                        return `
                        <div class="bg-white p-5 rounded-[1.5rem] border border-slate-200 shadow-sm flex flex-col cursor-pointer hover:border-red-400 hover:shadow-lg transition-all group" onclick="hideRiskListModal(); switchView('matrix');">
                            <div class="flex justify-between items-center mb-4 pb-3 border-b border-slate-100">
                                <h3 class="text-lg font-black text-slate-800 group-hover:text-red-600 transition-colors">${item.name}</h3>
                                <i data-lucide="chevron-right" class="w-5 h-5 text-slate-300 group-hover:text-red-500 group-hover:translate-x-1 transition-transform"></i>
                            </div>
                            <div class="flex flex-wrap gap-2">${risksHtml}</div>
                        </div>`;
                    }).join('');
                }
                lucide.createIcons();
                modal.classList.remove('hidden');
            }
        };

        window.hideRiskListModal = function() {
            const modal = document.getElementById('riskListModal');
            if (modal) modal.classList.add('hidden');
        };

        window.showAllFeedsModal = function() {
            const modal = document.getElementById('feedListModal');
            const tbody = document.getElementById('feedListTableBody');
            const count = document.getElementById('feedCount');
            
            if (modal && tbody) {
                count.innerText = allFeedData.length;
                tbody.innerHTML = allFeedData.map(feed => `
                    <tr class="hover:bg-slate-50 transition-colors">
                        <td class="p-4 whitespace-nowrap text-slate-500 font-mono text-xs">${feed.updated.toLocaleString('ja-JP')}</td>
                        <td class="p-4 whitespace-nowrap font-bold text-slate-700 text-xs">${feed.author || '-'}</td>
                        <td class="p-4 text-slate-800 font-medium text-[13px]">${feed.title}</td>
                        <td class="p-4 text-center">
                            <a href="${feed.link}" target="_blank" class="text-blue-600 hover:bg-blue-100 px-3 py-1.5 rounded-lg inline-flex items-center gap-1.5 text-[11px] font-black transition-colors">
                                <i data-lucide="external-link" class="w-3.5 h-3.5"></i> 開く
                            </a>
                        </td>
                    </tr>
                `).join('');
                lucide.createIcons();
                modal.classList.remove('hidden');
            }
        };

        window.hideAllFeedsModal = function() {
            const modal = document.getElementById('feedListModal');
            if (modal) modal.classList.add('hidden');
        };

        window.copyRawJson = function() {
            const rawTextArea = document.getElementById('rawTextArea');
            if (rawTextArea) {
                rawTextArea.select();
                document.execCommand('copy');
                
                const copyBtn = document.querySelector('#rawJsonArea button');
                if (copyBtn) {
                    copyBtn.innerText = "コピー完了！";
                    setTimeout(() => { copyBtn.innerText = "コピー"; }, 1500);
                }
            }
        }

        window.onload = init;
    </script>
</body>
</html>
