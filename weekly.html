<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EWC気象情報 府県週間天気</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=JetBrains+Mono:wght@400;700&display=swap');
        
        body {
            font-family: 'Noto Sans JP', sans-serif;
            background-color: #f8fafc;
            color: #0f172a;
            -webkit-tap-highlight-color: transparent;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .view-transition {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .hidden-view {
            display: none;
            opacity: 0;
            transform: translateY(15px);
        }

        .region-group-card {
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 1.5rem;
            overflow: hidden;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }

        /* 週間予報テーブル */
        .forecast-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 8px;
            overflow-x: auto;
        }
        .forecast-day {
            min-width: 85px;
            text-align: center;
            padding: 20px 8px;
            border-radius: 1.5rem;
            background: white;
            border: 1px solid #f1f5f9;
            transition: all 0.2s;
        }
        .day-sat { color: #2563eb; }
        .day-sun { color: #dc2626; }

        .weather-image {
            width: 54px;
            height: 54px;
            object-fit: contain;
            margin: 0 auto;
        }

        .custom-scrollbar::-webkit-scrollbar { height: 6px; width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }

        header, footer { flex-shrink: 0; }
        main { flex: 1 0 auto; }

        /* ナビゲーションバーの高さ固定 */
        .nav-bar-height {
            height: 64px;
        }
        @media (min-width: 640px) {
            .nav-bar-height {
                height: 80px;
            }
        }
    </style>
</head>
<body class="custom-scrollbar">

    <!-- Global Header -->
    <header class="border-b border-slate-200 sticky top-0 bg-white/90 backdrop-blur-md z-[60]">
        <div class="max-w-5xl mx-auto px-4 sm:px-6 py-4 flex items-center justify-between">
            <button onclick="showRegions()" class="text-left group">
                <h1 class="text-[9px] sm:text-[10px] font-black tracking-[0.3em] text-slate-400 uppercase leading-none mb-1">EWC Meteorological</h1>
                <div class="flex items-center gap-2">
                    <span class="w-1.5 h-1.5 sm:w-2 h-2 bg-blue-600 rounded-full"></span>
                    <span class="text-base sm:text-lg text-slate-900 font-black tracking-tighter leading-none">EWC気象情報</span>
                </div>
            </button>
            <div class="flex items-center gap-3">
                <div id="lastUpdate" class="text-[10px] font-mono font-bold text-slate-400 hidden md:block">読み込み中...</div>
                <button id="refreshBtn" onclick="refreshFeeds()" class="px-4 py-2 hover:bg-slate-900 hover:text-white rounded-lg text-slate-600 transition-all text-[10px] sm:text-xs font-black border border-slate-200 uppercase">
                    更新
                </button>
            </div>
        </div>
    </header>

    <!-- Main -->
    <main class="w-full max-w-5xl mx-auto px-4 sm:px-6 pb-24 relative">
        
        <!-- 1. 地域選択画面 -->
        <div id="regionView" class="view-transition pt-12">
            <div class="mb-10 px-1">
                <h2 class="text-3xl sm:text-5xl font-black text-slate-900 tracking-tighter mb-4 italic">地域を選択してください</h2>
                <p class="text-sm sm:text-base text-slate-500 font-medium leading-relaxed max-w-2xl">
                    全国各地の週間天気予報
                </p>
            </div>
            <div id="regionGroups" class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- JS生成 -->
            </div>
        </div>

        <!-- 2. 電文リスト画面 -->
        <div id="listView" class="view-transition hidden-view">
            <!-- 統一ナビゲーションバー -->
            <div class="nav-bar-height flex items-center border-b border-slate-200 mb-8 -mx-4 sm:-mx-6 px-4 sm:px-6 bg-white/50 sticky top-0 z-30 backdrop-blur-sm">
                <button onclick="showRegions()" class="flex items-center gap-2 text-slate-900 hover:bg-slate-100 transition-all px-4 py-2 rounded-xl text-xs font-black border border-slate-200 uppercase">
                    <i data-lucide="chevron-left" class="w-4 h-4"></i> 地域選択に戻る
                </button>
            </div>

            <div class="mb-10 px-1">
                <h2 id="selectedRegionName" class="text-4xl sm:text-6xl font-black text-slate-900 tracking-tighter leading-none">地域名</h2>
            </div>
            <div id="bulletinList" class="space-y-4">
                <!-- JS生成 -->
            </div>
        </div>

        <!-- 3. 詳細画面 -->
        <div id="detailView" class="view-transition hidden-view fixed inset-0 z-[100] bg-white overflow-hidden">
            <!-- 統一ナビゲーションバー (Detail) -->
            <div class="absolute top-0 left-0 right-0 nav-bar-height bg-white border-b border-slate-100 z-[110]">
                <div class="max-w-5xl mx-auto h-full flex items-center justify-between px-4 sm:px-6">
                    <button onclick="showList()" class="flex items-center gap-2 text-slate-900 hover:bg-slate-50 transition-all px-4 py-2 rounded-xl text-xs font-black border border-slate-200 uppercase">
                        <i data-lucide="chevron-left" class="w-4 h-4"></i> 戻る
                    </button>
                    <div id="navTitle" class="text-slate-900 text-xs sm:text-sm font-black tracking-tight truncate flex-1 text-center px-4"></div>
                    <div class="w-10 sm:w-24"></div>
                </div>
            </div>
            <div id="detailBoard" class="w-full h-full overflow-y-auto pt-20 sm:pt-24 pb-40 custom-scrollbar bg-slate-50/50">
                <!-- 予報ボード生成 -->
            </div>
        </div>

    </main>

                { id: "kagoshima", name: "鹿児島県", keywords: ["鹿児島"] }, { id: "okinawa", name: "沖縄県", keywords: ["沖縄", "那覇", "宮古島", "石垣"] }

        let allFeedData = [];
        let currentRegion = null;

        function init() {
            renderRegions();
            refreshFeeds();
            lucide.createIcons();
        }

        function renderRegions() {
            const container = document.getElementById('regionGroups');
            container.innerHTML = REGION_GROUPS.map(group => `
                <div class="region-group-card">
                    <div class="bg-slate-50 px-6 py-4 border-b border-slate-100">
                        <span class="text-[10px] font-black text-slate-400 uppercase tracking-widest">${group.label}</span>
                    </div>
                    <div class="grid grid-cols-2 sm:grid-cols-3 divide-x divide-y divide-slate-100">
                        ${group.regions.map(r => `
                            <button onclick="selectRegion('${r.id}')" class="p-4 text-left hover:bg-slate-50 transition-all flex items-center justify-between group">
                                <span class="text-xs sm:text-sm font-bold text-slate-700 group-hover:text-blue-600">${r.name}</span>
                                <i data-lucide="chevron-right" class="w-3 h-3 text-slate-200 group-hover:text-blue-600 transition-all"></i>
                            </button>
                        `).join('')}
                    </div>
                </div>
            `).join('');
            lucide.createIcons();
        }

        async function refreshFeeds() {
            const btn = document.getElementById('refreshBtn');
            const time = document.getElementById('lastUpdate');
            
            btn.disabled = true;
            btn.classList.add('opacity-50', 'cursor-not-allowed');
            
            try {
                let items = [];
                const res = await fetch("https://www.data.jma.go.jp/developer/xml/feed/regular.xml");
                const xml = new DOMParser().parseFromString(await res.text(), "text/xml");
                const entries = Array.from(xml.getElementsByTagName('entry'));

                entries.forEach(e => {
                    const title = e.getElementsByTagName('title')[0]?.textContent || "";
                    if (!title.includes("府県週間天気予報")) return;
                    items.push({
                        title,
                        updated: new Date(e.getElementsByTagName('updated')[0]?.textContent),
                        author: e.getElementsByTagName('author')[0]?.getElementsByTagName('name')[0]?.textContent,
                        link: e.querySelector('link[type="application/xml"]')?.getAttribute('href')
                    });
                });

                allFeedData = items;
                time.innerText = new Date().toLocaleTimeString('ja-JP') + " 更新";
            } catch (e) {
                console.error(e);
            } finally {
                btn.disabled = false;
                btn.classList.remove('opacity-50', 'cursor-not-allowed');
            }
        }

        function selectRegion(id) {
            for (const g of REGION_GROUPS) {
                const f = g.regions.find(r => r.id === id);
                if (f) { currentRegion = f; break; }
            }
            document.getElementById('selectedRegionName').innerText = currentRegion.name;
            showView('listView');
            renderBulletinList();
        }

        function renderBulletinList() {
            const list = document.getElementById('bulletinList');
            
            const filtered = allFeedData.filter(item => 
                currentRegion.keywords.some(k => item.author.includes(k)) || item.title.includes(currentRegion.name)
            ).sort((a, b) => b.updated - a.updated);

            if (filtered.length === 0) {
                list.innerHTML = `<div class="p-20 text-center bg-white rounded-3xl border border-slate-200 text-slate-400 text-xs font-bold uppercase tracking-widest">現在、配信中の予報はありません</div>`;
                return;
            }

            list.innerHTML = filtered.map(item => `
                <button onclick="fetchDetail('${item.link}', '${item.title}')" class="w-full text-left p-6 bg-white border border-slate-200 rounded-3xl hover:border-blue-500 hover:shadow-xl transition-all group flex items-center justify-between">
                    <div>
                        <h3 class="text-lg font-black text-slate-900 group-hover:text-blue-600 transition-colors">${item.title}</h3>
                        <div class="flex items-center gap-4 mt-3">
                            <span class="text-[10px] font-bold text-slate-400">発表：${item.author}</span>
                            <span class="text-[10px] font-mono font-bold text-slate-300">${item.updated.toLocaleString('ja-JP')}</span>
                        </div>
                    </div>
                    <i data-lucide="arrow-right" class="w-5 h-5 text-slate-200 group-hover:text-blue-600 group-hover:translate-x-1 transition-all"></i>
                </button>
            `).join('');
            lucide.createIcons();
        }

        async function fetchDetail(link, title) {
            const board = document.getElementById('detailBoard');
            const nav = document.getElementById('navTitle');

            showView('detailView');
            nav.innerText = title;
            board.innerHTML = `<div class="flex items-center justify-center h-40"><div class="w-8 h-8 border-4 border-slate-200 border-t-blue-600 rounded-full animate-spin"></div></div>`;

            try {
                const res = await fetch(link);
                const xmlStr = await res.text();
                renderBoard(xmlStr, board);
            } catch (e) {
                board.innerHTML = `<div class="p-20 text-center text-slate-400 font-bold">データの解析に失敗しました</div>`;
            }
        }

        function getDriveId(rawCode, weatherText) {
            const normalize = (txt) => txt.replace(/れ/g, '').replace(/り/g, '').replace(/くも/g, '曇').replace(/時々/g, '一時');
            let finalCode = CODE_OVERRIDE[rawCode] || rawCode;
            let weatherFromCode = WEATHER_CODES[finalCode];
            
            if (ICON_MAP[weatherFromCode]) return ICON_MAP[weatherFromCode];
            const normText = normalize(weatherText);
            if (ICON_MAP[normText]) return ICON_MAP[normText];
            for (let key in ICON_MAP) if (normText.includes(key)) return ICON_MAP[key];
            return null;
        }

        function renderBoard(xmlStr, container) {
            const xml = new DOMParser().parseFromString(xmlStr, "text/xml");
            const areaInfos = Array.from(xml.querySelectorAll('MeteorologicalInfos')).find(i => i.getAttribute('type') === '区域予報');
            const pointInfos = Array.from(xml.querySelectorAll('MeteorologicalInfos')).find(i => i.getAttribute('type') === '地点予報');
            
            if (!areaInfos) {
                container.innerHTML = `<div class="p-20 text-center text-slate-400 font-bold">有効な区域予報データが見つかりません</div>`;
                return;
            }

            const areaForecast = areaInfos.querySelector('TimeSeriesInfo');
            const pointForecast = pointInfos?.querySelector('TimeSeriesInfo');
            const areaName = areaForecast.querySelector('Area > Name')?.textContent || "対象地域";

            const timeDefines = Array.from(areaForecast.querySelectorAll('TimeDefines > TimeDefine'));
            const dates = timeDefines.map(td => {
                const d = new Date(td.querySelector('DateTime').textContent);
                return { label: `${d.getMonth() + 1}/${d.getDate()}`, weekday: ["日", "月", "火", "水", "木", "金", "土"][d.getDay()], isSat: d.getDay() === 6, isSun: d.getDay() === 0 };
            });

            const props = Array.from(areaForecast.querySelectorAll('Item > Kind > Property'));
            const weathers = Array.from(props.find(p => p.querySelector('Type')?.textContent === '天気')?.querySelectorAll('jmx_eb\\:Weather, Weather') || []);
            const weatherCodes = Array.from(props.find(p => p.querySelector('Type')?.textContent === '天気')?.querySelectorAll('jmx_eb\\:WeatherCode, WeatherCode') || []);
            const rains = Array.from(props.find(p => p.querySelector('Type')?.textContent === '降水確率')?.querySelectorAll('jmx_eb\\:ProbabilityOfPrecipitation, ProbabilityOfPrecipitation') || []);
            const rels = Array.from(props.find(p => p.querySelector('Type')?.textContent === '信頼度')?.querySelectorAll('jmx_eb\\:ReliabilityClass, ReliabilityClass') || []);

            let minTemps = [], maxTemps = [];
            if (pointForecast) {
                const tProps = Array.from(pointForecast.querySelectorAll('Item > Kind > Property'));
                minTemps = Array.from(tProps.find(p => p.querySelector('Type')?.textContent === '最低気温')?.querySelectorAll('jmx_eb\\:Temperature, Temperature') || []);
                maxTemps = Array.from(tProps.find(p => p.querySelector('Type')?.textContent === '最高気温')?.querySelectorAll('jmx_eb\\:Temperature, Temperature') || []);
            }

            let html = `<div class="max-w-4xl mx-auto px-6"><div class="mb-12 text-center"><h2 class="text-4xl font-black text-slate-900 mb-2">${areaName}</h2><p class="text-[10px] font-black text-blue-600 uppercase tracking-[0.4em]">週間天気予報</p></div><div class="forecast-grid mb-12">`;

            dates.forEach((date, i) => {
                const weatherText = weathers[i]?.textContent || "-";
                const rainVal = rains[i]?.textContent || "-";
                const relVal = rels[i]?.textContent || "";
                const minVal = minTemps[i]?.textContent || "-";
                const maxVal = maxTemps[i]?.textContent || "-";
                const rawCode = weatherCodes[i]?.textContent || "";

                const driveId = getDriveId(rawCode, weatherText);
                let fallbackIcon = weatherText.includes("晴") ? "sun" : weatherText.includes("雨") ? "cloud-rain" : weatherText.includes("雪") ? "cloud-snow" : "cloud";

                html += `
                    <div class="forecast-day shadow-sm flex flex-col items-center">
                        <span class="text-[10px] font-black text-slate-300 mb-1 tracking-tighter">${date.label}</span>
                        <span class="text-sm font-black mb-6 ${date.isSat ? 'day-sat' : date.isSun ? 'day-sun' : 'text-slate-500'}">(${date.weekday})</span>
                        <div class="mb-4 h-[54px] w-[54px] flex items-center justify-center relative">
                            ${driveId ? `<img src="https://lh3.googleusercontent.com/d/${driveId}" class="weather-image" alt="${weatherText}" onerror="this.style.display='none'; this.nextElementSibling.classList.remove('hidden');">` : ''}
                            <i data-lucide="${fallbackIcon}" class="w-8 h-8 text-slate-200 ${driveId ? 'hidden' : ''}"></i>
                        </div>
                        <span class="text-[10px] font-bold text-slate-700 mb-6 h-12 flex items-center justify-center leading-snug px-1">${weatherText}</span>
                        <div class="w-full pt-4 border-t border-slate-100 space-y-3">
                            <div class="flex items-center justify-center gap-1"><i data-lucide="droplets" class="w-3 h-3 text-blue-400"></i><span class="text-[10px] font-black text-blue-600">${rainVal}%</span></div>
                            <div class="flex flex-col"><span class="text-sm font-black text-red-500">${maxVal}°</span><span class="text-sm font-black text-blue-400">${minVal}°</span></div>
                            ${relVal && relVal !== "値なし" ? `<div class="mt-2"><span class="text-[8px] font-black bg-slate-100 text-slate-500 px-1.5 py-0.5 rounded border border-slate-200">信頼度:${relVal}</span></div>` : ''}
                        </div>
                    </div>
                `;
            });

            html += `</div></div>`;
            container.innerHTML = html;
            lucide.createIcons();
        }

        function showRegions() { showView('regionView'); }
        function showList() { showView('listView'); }
        function showView(id) {
            ['regionView', 'listView', 'detailView'].forEach(v => {
                const el = document.getElementById(v);
                if (v === id) { el.classList.remove('hidden-view'); setTimeout(() => el.style.opacity = "1", 10); }
                else { el.classList.add('hidden-view'); el.style.opacity = "0"; }
            });
        }

        window.onload = init;
    </script>
</body>
</html>
