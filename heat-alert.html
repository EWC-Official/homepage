            const tempHtml = !isNoAlert && data.maxTempList && data.maxTempList.length > 0 ? `
                <div class="mb-4">
                    <h3 class="text-[11px] font-black text-slate-400 uppercase tracking-widest mb-2 flex items-center gap-1"><i data-lucide="sun" class="w-3.5 h-3.5 text-orange-500"></i> 予想最高気温</h3>
                    <div class="flex flex-wrap gap-2">
                        ${data.maxTempList.map(item => `
                            <div class="px-3 py-1.5 bg-orange-50 border border-orange-100 rounded-lg flex items-center gap-2">
                                <span class="text-[10px] font-bold text-slate-600">${item.name}</span><span class="text-sm font-black text-orange-600">${item.val}<small class="text-[9px]">℃</small></span>
                            </div>
                        `).join('')}
                    </div>
                </div>
            ` : '';

            let badgeClass = 'bg-slate-200 text-slate-500'; let badgeText = 'アラート発表なし';
            if (!isNoAlert) {
                badgeClass = 'bg-purple-600 text-white'; badgeText = '警戒アラート';
                if (data.isSpecial) { badgeClass = 'bg-black text-white'; badgeText = '特別警戒アラート'; }
            }

            panel.innerHTML = `
                <div class="p-8 md:p-6 space-y-4 text-left pt-12 md:pt-6 h-full flex flex-col">
                    <div class="flex justify-between items-start flex-shrink-0">
                        <div class="space-y-1 text-left">
                            <div class="inline-flex items-center gap-1 px-2 py-0.5 ${badgeClass} rounded text-[9px] font-black uppercase tracking-widest">${badgeText}</div>
                            <h3 class="text-xl font-black text-slate-900 tracking-tighter leading-tight mt-1">${data.title}</h3>
                            <p class="text-[10px] font-bold text-slate-400">${isNoAlert ? '現在' : new Date(data.reportTime).toLocaleString('ja-JP') + ' 発表'}</p>
                        </div>
                        <button onclick="hideStationDetail()" class="w-10 h-10 flex items-center justify-center bg-slate-100 rounded-full active:scale-90 shadow-sm border border-slate-200 hover:bg-slate-200 transition-all flex-shrink-0 ml-2">
                            <i data-lucide="x" class="w-5 h-5 text-slate-500"></i>
                        </button>
                    </div>
                    <div class="bg-white/95 p-4 rounded-2xl border border-slate-150 shadow-md flex-1 overflow-y-auto custom-scrollbar">
                        ${preventionHtml} ${wbgtHtml} ${tempHtml}
                    </div>
                </div>
            `;
            lucide.createIcons();

            // クリックされたポリゴンのBoundsが直接渡されている場合は最優先でそれを使う
            if (targetBounds) {
                flyToBounds(targetBounds.minX, targetBounds.minY, targetBounds.maxX, targetBounds.maxY);
            } 
            // リストなどから呼び出された場合は名前で検索してフライする
            else if (cachedJapanFeatures) {
                // 誤判定を防ぐため、まずは「完全一致」を優先して検索
                let feat = cachedJapanFeatures.find(f => f.subRegion === data.subRegionName);
                
                // 完全一致がない場合のみ、緩い一致で検索する
                if (!feat) {
                    feat = cachedJapanFeatures.find(f => {
                        return isSubRegionMatch(f.subRegion, data.subRegionName) || isSubRegionMatch(f.subRegion, data.prefName);
                    });
                }
                
                if (feat) { 
                    const b = feat.bounds;
                    flyToBounds(b.minX, b.minY, b.maxX, b.maxY);
                }
            }
        }

        function hideStationDetail() {
            document.getElementById('detailPanel').classList.add('hidden');
            const legendEl = document.getElementById('mapLegend'); if (legendEl) legendEl.classList.remove('hide-legend');
            currentStationId = null;
        }

        const extremeLinesPlugin = {
            id: 'extremeLines',
            beforeDatasetsDraw(chart) {
                const { ctx, chartArea, scales: { x } } = chart; const labels = chart.config.data.labels; const lines = chart.config.data.extremeLines;
                ctx.save(); ctx.lineWidth = 1; ctx.setLineDash([4, 4]); ctx.strokeStyle = 'rgba(15, 23, 42, 0.4)'; 
                labels.forEach((label, idx) => {
                    if (label.endsWith(' 0:00')) {
                        const xPos = x.getPixelForValue(idx); if (xPos >= chartArea.left && xPos <= chartArea.right) { ctx.beginPath(); ctx.moveTo(xPos, chartArea.top); ctx.lineTo(xPos, chartArea.bottom); ctx.stroke(); }
                    }
                });
                if (lines && Array.isArray(lines)) {
                    ctx.lineWidth = 1.5; ctx.setLineDash([5, 5]);
                    lines.forEach(line => {
                        if (line.index >= 0) {
                            const xPos = x.getPixelForValue(line.index);
                            if (xPos >= chartArea.left && xPos <= chartArea.right) {
                                ctx.beginPath(); ctx.strokeStyle = line.type === 'max' ? 'rgba(239, 68, 68, 0.8)' : 'rgba(59, 130, 246, 0.8)';
                                ctx.moveTo(xPos, chartArea.top); ctx.lineTo(xPos, chartArea.bottom); ctx.stroke();
                            }
                        }
                    });
                }
                ctx.restore();
            }
        };

        async function fetchStationTimeSeries(stationId) {
            if (lastFetchedStationId === stationId && Object.keys(currentStationData).length > 0) return currentStationData; 
            currentStationData = {}; const fetchPromises = []; const baseTime = selectedDate ? new Date(selectedDate) : new Date(); 
            for (let i = 0; i <= 17; i++) {
                const targetTime = new Date(baseTime.getTime() - i * 3 * 60 * 60 * 1000); const jstTime = new Date(targetTime.getTime() + 9 * 60 * 60 * 1000);
                const yyyy = jstTime.getUTCFullYear(); const mm = String(jstTime.getUTCMonth() + 1).padStart(2, '0'); const dd = String(jstTime.getUTCDate()).padStart(2, '0');
                const blockHour = Math.floor(jstTime.getUTCHours() / 3) * 3; const hh = String(blockHour).padStart(2, '0');
                const url = `https://www.jma.go.jp/bosai/amedas/data/point/${stationId}/${yyyy}${mm}${dd}_${hh}.json`;
                fetchPromises.push(fetch(url).then(res => res.ok ? res.json() : null).catch(() => null));
            }
            const results = await Promise.all(fetchPromises);
            results.forEach(res => { if (res) Object.assign(currentStationData, res); }); lastFetchedStationId = stationId; return currentStationData;
        }

        async function renderChart(stationId) {
            const chartContainer = document.getElementById('chartContainer'); if (!chartContainer) return;
            chartContainer.innerHTML = '<div class="flex justify-center items-center h-full"><p class="text-[10px] font-bold text-slate-400 animate-pulse uppercase tracking-widest italic">グラフデータを取得中...</p></div>';
            const tsData = await fetchStationTimeSeries(stationId);
            chartContainer.innerHTML = '<canvas id="stationChart"></canvas>'; const ctx = document.getElementById('stationChart').getContext('2d');
            const labels = []; const dataPoints = []; const dailyExtremes = {}; const sortedKeys = Object.keys(tsData).sort();
            const baseTime = selectedDate ? new Date(selectedDate) : new Date();
            const twoDaysAgoStr = formatJmaTime(new Date(baseTime.getTime() - 48 * 60 * 60 * 1000)); 
            const todayStr = String(new Date(baseTime.getTime() + 9 * 60 * 60 * 1000).getUTCDate()).padStart(2, '0');

            sortedKeys.forEach(key => {
                if (key >= twoDaysAgoStr) {
                    const dStr = key.substring(6, 8); const minStr = key.substring(10, 12);
                    if (currentGraphInterval === 60 && minStr !== '00') return;
                    const obs = tsData[key]; let wbgtVal = null;
                    if (obs.temp && obs.humidity && obs.wind && obs.temp[0] !== null && obs.humidity[0] !== null && obs.wind[0] !== null) {
                        wbgtVal = calculateWBGT(obs.temp[0], obs.humidity[0], obs.wind[0], obs.sun1h ? obs.sun1h[0] : 0);
                    }
                    const timeLabel = `${Number(key.substring(4, 6))}/${Number(dStr)} ${Number(key.substring(8, 10))}:${minStr}`;
                    labels.push(timeLabel); dataPoints.push(wbgtVal);
                    if (!dailyExtremes[dStr]) dailyExtremes[dStr] = { max: -99999, min: 99999, maxTime: "", minTime: "" };
                    if (wbgtVal !== null) {
                        if (wbgtVal > dailyExtremes[dStr].max) { dailyExtremes[dStr].max = wbgtVal; dailyExtremes[dStr].maxTime = timeLabel; }
                        if (wbgtVal < dailyExtremes[dStr].min) { dailyExtremes[dStr].min = wbgtVal; dailyExtremes[dStr].minTime = timeLabel; }
                    }
                }
            });
            
            const extremesEl = document.getElementById('dailyExtremes'); const todayExt = dailyExtremes[todayStr];
            if (extremesEl && todayExt && todayExt.max !== -99999) {
                extremesEl.innerHTML = `
                    <div class="flex flex-wrap gap-2 items-center justify-center">
                        <div class="flex items-center gap-1.5 bg-red-50 px-3 py-1.5 rounded-xl border border-red-200/60 shadow-sm"><span class="text-[9px] font-black text-red-500">今日の最高</span><span class="text-sm font-black text-red-600">${todayExt.max.toFixed(1)}</span><span class="text-[10px] font-bold text-red-400">(${todayExt.maxTime})</span></div>
                        <div class="flex items-center gap-1.5 bg-blue-50 px-3 py-1.5 rounded-xl border border-blue-200/60 shadow-sm"><span class="text-[9px] font-black text-blue-500">今日の最低</span><span class="text-sm font-black text-blue-600">${todayExt.min.toFixed(1)}</span><span class="text-[10px] font-bold text-red-400">(${todayExt.minTime})</span></div>
                    </div>
                `;
                extremesEl.classList.remove('hidden');
            } else if (extremesEl) extremesEl.classList.add('hidden');

            const extremeLines = [];
            Object.keys(dailyExtremes).forEach(dStr => {
                const ext = dailyExtremes[dStr];
                if (ext.max !== -99999) { const idx = labels.indexOf(ext.maxTime); if (idx >= 0) extremeLines.push({ index: idx, type: 'max' }); }
                if (ext.min !== 99999) { const idx = labels.indexOf(ext.minTime); if (idx >= 0) extremeLines.push({ index: idx, type: 'min' }); }
            });

            if (currentChart) currentChart.destroy();
            currentChart = new Chart(ctx, {
                type: 'line',
                data: { labels: labels, extremeLines: extremeLines, datasets: [{ label: 'WBGT', data: dataPoints, type: 'line', borderWidth: 2.5, tension: 0.4, pointRadius: 0, pointHoverRadius: 0, fill: 'origin', spanGaps: false, segment: { borderColor: ctx => ctx.p1.raw !== null ? getColorForWBGT(ctx.p1.raw) : 'transparent', backgroundColor: ctx => ctx.p1.raw !== null ? hexToRgba(getColorForWBGT(ctx.p1.raw), 0.25) : 'transparent' } }] },
                plugins: [extremeLinesPlugin],
                options: {
                    responsive: true, maintainAspectRatio: false, layout: { padding: { top: 10 } },
                    plugins: {
                        legend: { display: false },
                        tooltip: { backgroundColor: 'rgba(15, 23, 42, 0.9)', titleFont: { family: 'Noto Sans JP', size: 10 }, bodyFont: { family: 'Noto Sans JP', size: 12, weight: 'bold' }, padding: 10, displayColors: false, callbacks: { label: function(context) { return `WBGT: ${context.parsed.y.toFixed(1)}`; } } },
                        zoom: { pan: { enabled: true, mode: 'x' }, zoom: { wheel: { enabled: false }, pinch: { enabled: true }, mode: 'x' } }
                    },
                    interaction: { mode: 'index', intersect: false },
                    scales: {
                        x: { grid: { display: false }, ticks: { autoSkip: true, maxTicksLimit: 12, maxRotation: 0, minRotation: 0, font: { family: 'Noto Sans JP', size: 9 }, color: '#94a3b8', callback: function(val, idx) {
                            const lbl = labels[idx]; if (!lbl) return null; const parts = lbl.split(' '); if (parts.length < 2) return lbl;
                            const [hStr, mStr] = parts[1].split(':'); const h = parseInt(hStr, 10); const m = parseInt(mStr, 10); const range = this.max - this.min;
                            if (range <= 36) return lbl; else if (range <= 100) return m === 0 ? parts[1] : null; else return (h % 3 === 0 && m === 0) ? (h === 0 ? lbl : parts[1]) : null;
                        }}},
                        y: { grid: { color: '#f1f5f9' }, ticks: { font: { family: 'Noto Sans JP', size: 10 }, color: '#64748b' } }
                    }
                }
            });
            document.getElementById('stationChart').addEventListener('wheel', (e) => {
                if (Math.abs(e.deltaX) > Math.abs(e.deltaY)) { e.preventDefault(); if (currentChart) currentChart.pan({x: -e.deltaX}); }
            }, { passive: false });
        }

        function toggleSidebarViaButton() {
            isSidebarOpen = !isSidebarOpen; const sidebar = document.getElementById('sidebar');
            if (isSidebarOpen) sidebar.classList.add('sidebar-open'); else sidebar.classList.remove('sidebar-open');
        }

        function toggleLegend() {
            isLegendCollapsed = !isLegendCollapsed; const legendEl = document.getElementById('mapLegend'); const iconEl = document.getElementById('legend-toggle-icon');
            if (isLegendCollapsed) { legendEl.classList.add('collapsed-legend'); iconEl.setAttribute('data-lucide', 'chevron-up'); }
            else { legendEl.classList.remove('collapsed-legend'); iconEl.setAttribute('data-lucide', 'chevron-down'); }
            lucide.createIcons();
        }

        function onAreaChange(area) {
            selectedArea = area; selectedPref = 'all'; 
            const prefSelector = document.getElementById('prefSelector'); const listPrefSelector = document.getElementById('listPrefSelector');
            let optionsHtml = '';
            if (area === 'all') {
                optionsHtml = '<option value="all">すべて</option>';
                if (prefSelector) { prefSelector.innerHTML = '<option value="all">都府県</option>'; prefSelector.disabled = true; }
                if (listPrefSelector) { listPrefSelector.innerHTML = optionsHtml; listPrefSelector.disabled = true; }
            } else {
                const prefs = REGION_PREFS[area] || []; optionsHtml = '<option value="all">すべて</option>';
                prefs.forEach(p => { optionsHtml += `<option value="${p}">${p}</option>`; });
                if (prefSelector) { prefSelector.innerHTML = optionsHtml; prefSelector.disabled = false; }
                if (listPrefSelector) { listPrefSelector.innerHTML = optionsHtml; listPrefSelector.disabled = false; }
            }
            const areaSelector = document.getElementById('areaSelector'); const listAreaSelector = document.getElementById('listAreaSelector');
            if (areaSelector && areaSelector.value !== area) areaSelector.value = area;
            if (listAreaSelector && listAreaSelector.value !== area) listAreaSelector.value = area;
            applyFilter();
        }

        function onPrefChange(pref) {
            selectedPref = pref; const prefSelector = document.getElementById('prefSelector'); const listPrefSelector = document.getElementById('listPrefSelector');
            if (prefSelector && prefSelector.value !== pref) prefSelector.value = pref;
            if (listPrefSelector && listPrefSelector.value !== pref) listPrefSelector.value = pref;
            applyFilter();
        }

        function applyFilter() {
            renderMarkers(); renderStationList(); renderDangerList(); 
            if (isTableModeActive) refreshTableData();
            
            const activeLatLngs = []; Object.values(activeMarkersData).forEach(m => { activeLatLngs.push(m); });
            if (activeLatLngs.length > 0 && (selectedArea !== 'all' || selectedPref !== 'all')) { 
                let minX=Infinity, minY=Infinity, maxX=-Infinity, maxY=-Infinity;
                activeLatLngs.forEach(m => {
                    if(m.x < minX) minX = m.x; if(m.x > maxX) maxX = m.x;
                    if(m.y < minY) minY = m.y; if(m.y > maxY) maxY = m.y;
                });
                if(minX !== Infinity) flyToBounds(minX, minY, maxX, maxY);
            }
        }

        function onListSearchInput(val) { const sidebarSearch = document.getElementById('searchBox'); if (sidebarSearch) sidebarSearch.value = val; refreshTableData(); }

        function searchStation(q) {
            const list = document.getElementById('stationList'); if (!list || !q) { renderStationList(); return; }
            const results = Object.keys(calculatedData).filter(id => {
                const meta = stationTable[id]; if (!meta || !meta.kjName.includes(q)) return false; const pref = getPrefByStationId(id);
                if (selectedArea !== 'all' && !(REGION_PREFS[selectedArea] || []).includes(pref)) return false;
                if (selectedPref !== 'all' && pref !== selectedPref) return false; return true;
            }).slice(0, 50);
            list.innerHTML = results.map(id => `<div onclick="showStationDetail('${id}')" class="p-4 bg-white border border-slate-100 rounded-2xl flex items-center cursor-pointer shadow-sm hover:bg-slate-50"><h4 class="text-sm font-bold text-slate-700">${stationTable[id].kjName}</h4></div>`).join('');
        }

        function toggleTableMode(active) {
            isTableModeActive = active; const appContainer = document.getElementById('appMainFrame');
            if (active) { appContainer.classList.add('table-view-active'); refreshTableData(); } else appContainer.classList.remove('table-view-active');
        }

        function renderTableHeader() {
            const headerRow = document.getElementById('tableHeaderRow'); if (!headerRow) return;
            const getSortIcon = (col) => {
                if (sortColumn !== col) return '<i data-lucide="arrow-up-down" class="w-3 h-3 text-slate-300"></i>';
                return sortDirection === 'desc' ? '<i data-lucide="chevron-down" class="w-3.5 h-3.5 text-orange-600 font-extrabold inline"></i>' : '<i data-lucide="chevron-up" class="w-3.5 h-3.5 text-orange-600 font-extrabold inline"></i>';
            };
            headerRow.innerHTML = `
                <th class="p-2 md:p-3 text-slate-500 text-[10px] font-black w-[100px] md:w-[140px] whitespace-nowrap">観測点名</th>
                <th class="p-2 md:p-3 text-slate-500 text-[10px] font-black w-[80px] md:w-[110px] whitespace-nowrap">都府県/地域</th>
                <th class="p-2 md:p-3 cursor-pointer hover:bg-slate-100 transition-colors select-none text-right whitespace-nowrap" onclick="sortTable('wbgt')">
                    <div class="flex items-center justify-end gap-1 text-slate-500 text-[10px] font-black whitespace-nowrap">WBGT ${getSortIcon('wbgt')}</div>
                </th>
                <th class="p-2 md:p-3 text-slate-500 text-[10px] font-black text-center w-[55px] md:w-[75px] whitespace-nowrap">詳細</th>
            `;
            lucide.createIcons();
        }

        function refreshTableData() {
            const searchVal = (document.getElementById('listSearchBox')?.value || "").trim(); renderTableHeader();
            const activeIds = Object.keys(calculatedData).filter(id => {
                const meta = stationTable[id]; if (!meta) return false; if (searchVal && !meta.kjName.includes(searchVal)) return false;
                const pref = getPrefByStationId(id); if (selectedArea !== 'all' && !(REGION_PREFS[selectedArea] || []).includes(pref)) return false;
                if (selectedPref !== 'all' && pref !== selectedPref) return false; return true;
            });
            const rows = activeIds.map(id => ({ id: id, kjName: stationTable[id].kjName, pref: getPrefByStationId(id), wbgt: calculatedData[id].wbgt }));
            rows.sort((a, b) => sortDirection === 'asc' ? a.wbgt - b.wbgt : b.wbgt - a.wbgt);
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = rows.map(r => {
                const color = getColorForWBGT(r.wbgt); const dotHtml = `<div class="w-2.5 h-2.5 rounded-full border border-white inline-block shadow-sm flex-shrink-0" style="background:${color}"></div>`;
                return `
                    <tr class="hover:bg-slate-50/80 transition-colors">
                        <td class="p-2 md:p-3 flex items-center gap-1.5 max-w-[120px] md:max-w-[150px] truncate whitespace-nowrap">${dotHtml}<span class="text-slate-900 font-extrabold text-xs md:text-sm truncate" title="${r.kjName}">${r.kjName}</span></td>
                        <td class="p-2 md:p-3 text-slate-500 text-[11px] md:text-xs truncate max-w-[90px] md:max-w-[110px] whitespace-nowrap" title="${r.pref}">${r.pref}</td>
                        <td class="p-2 md:p-3 text-right font-black text-xs md:text-sm whitespace-nowrap" style="color: ${color};">${r.wbgt.toFixed(1)}</td>
                        <td class="p-2 md:p-3 text-center whitespace-nowrap"><button onclick="showStationDetail('${r.id}')" class="px-2 py-1 bg-slate-100 text-slate-600 rounded-lg hover:bg-orange-500 hover:text-white transition-all text-[10px] md:text-[11px] font-black">詳細</button></td>
                    </tr>
                `;
            }).join('');
        }

        function sortTable(columnName) {
            if (sortColumn === columnName) sortDirection = sortDirection === 'desc' ? 'asc' : 'desc'; else { sortColumn = columnName; sortDirection = 'desc'; }
            if (isTableModeActive) refreshTableData();
        }

        function resetView() { 
            document.getElementById('areaSelector').value = 'all'; onAreaChange('all');
            mapState.scale = 1.0;
            mapState.offsetX = 0;
            mapState.offsetY = 0;
            drawMapCore();
            hideStationDetail(); toggleTableMode(false); switchTab('today');
        }

        function changeGraphInterval(val) { currentGraphInterval = parseInt(val); if (currentStationId) renderChart(currentStationId); }

        function openGraphModal(stationId) {
            const modal = document.getElementById('graphModal'); const content = document.getElementById('graphModalContent'); const title = document.getElementById('graphModalTitle');
            title.innerText = stationTable[stationId].kjName; modal.classList.remove('pointer-events-none', 'opacity-0'); content.classList.remove('scale-95');
            currentStationId = stationId; renderChart(stationId);
        }

        function closeGraphModal() {
            const modal = document.getElementById('graphModal'); const content = document.getElementById('graphModalContent');
            modal.classList.add('pointer-events-none', 'opacity-0'); content.classList.add('scale-95'); currentStationId = null;
        }

        function panChart(dir) { if (!currentChart) return; const amount = dir === 'left' ? -20 : 20; currentChart.pan({x: amount}); }
        function zoomChart(dir) { if (!currentChart) return; const factor = dir === 'in' ? 1.2 : 0.8; currentChart.zoom(factor); }
        function resetChartZoom() { if (!currentChart) return; currentChart.resetZoom(); }

        window.onload = init;
    </script>
</body>
</html>
