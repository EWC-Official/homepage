            animation: fadeIn 0.3s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .category-header {
            position: sticky;
            top: 73px;
            z-index: 10;
            backdrop-filter: blur(8px);
        }

        .entry-card {
            transition: all 0.15s ease;
        }

        .weather-text {
            line-height: 2.1;
            letter-spacing: 0.02em;
        }

        #contentArea {
            transition: opacity 0.25s cubic-bezier(0.4, 0, 0.2, 1), transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* 横幅いっぱいに広げるための調整 */

        }

    <!-- アプリケーション・ロジック -->
    <script>
        const FEEDS = [
            "https://www.data.jma.go.jp/developer/xml/feed/regular.xml",
            "https://www.data.jma.go.jp/developer/xml/feed/extra.xml",
            "https://www.data.jma.go.jp/developer/xml/feed/other.xml"
        ];

        let allFetchedEntries = [];
        let isDemoMode = false;

        document.addEventListener('DOMContentLoaded', () => {
            initDarkMode();
            lucide.createIcons();
            detectCORSandFetch();
        });

        // CORS制限やネットワーク状態の自動検出
        async function detectCORSandFetch() {
            try {
                const response = await fetch(FEEDS[1], { method: 'HEAD' });
                isDemoMode = false;
            } catch (e) {
                console.warn("気象庁への直接フェッチ制限を検出しました。内蔵デモデータを使用します。");
                isDemoMode = true;
            }
            fetchFeeds();
        }

        function getXmlDocFromString(xmlText) {
            const cleanText = xmlText.replace(/<(\/?)(\w+):/g, '<$1');
            return new DOMParser().parseFromString(cleanText, "text/xml");
        }

        function formatToReiwa(date) {
            const year = date.getFullYear();
            const month = date.getMonth() + 1;
            const day = date.getDate();
            const hours = String(date.getHours()).padStart(2, '0');
            const minutes = String(date.getMinutes()).padStart(2, '0');
            const reiwaYear = year - 2018;
            const eraName = year >= 2019 ? `令和${reiwaYear}年` : `${year}年`;
            return `${eraName}${month}月${day}日 ${hours}:${minutes}`;
        }

        function extractFullTitle(entryXml) {
            const content = entryXml.getElementsByTagName('content')[0]?.textContent || "";
            const bracketMatch = content.match(/【([^】]+)】/);
            if (bracketMatch && bracketMatch[1]) return bracketMatch[1].trim();
            return entryXml.getElementsByTagName('title')[0]?.textContent || "";
        }

        function getNormalizedTitle(title) {
            return title
                .replace("（共同発表）", "")
                .replace("(共同発表)", "")
                .replace("（都道府県共同発表）", "")
                .replace("(都道府県共同発表)", "");
        }

        function getGroupKey(item) {
            const normalizedTitle = getNormalizedTitle(item.displayTitle);
            const minutes = Math.floor(item.updated.getTime() / (1000 * 60));
            return `${item.author}_${minutes}_${normalizedTitle}`;
        }

        // データの取得とパース（洪水予報: VPCC / 土砂警戒: VXKO50〜89）
        async function fetchFeeds() {
            try {
                document.getElementById('entryList').innerHTML = `
                    <div class="py-20 text-center text-slate-300 dark:text-slate-700">
                        <div class="inline-block h-5 w-5 border-2 border-slate-200 dark:border-slate-800 border-t-blue-500 rounded-full animate-spin"></div>
                    </div>`;

                const allItems = [];

                if (isDemoMode) {
                    const feedsToParse = [MOCK_DATA.feeds.regular, MOCK_DATA.feeds.extra, MOCK_DATA.feeds.other];
                    for (const feedText of feedsToParse) {
                        const xmlDoc = new DOMParser().parseFromString(feedText, "text/xml");
                        const entries = Array.from(xmlDoc.getElementsByTagName('entry'));
                        parseEntries(entries, allItems);
                    }
                } else {
                    for (const url of FEEDS) {
                        let text = "";
                        try {
                            const res = await fetch(url);
                            text = await res.text();
                        } catch (e) {
                            try {
                                const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`;
                                const res = await fetch(proxyUrl);
                                text = await res.text();
                            } catch (err) {
                                console.error(`フィード取得失敗(Live): ${url}`, err);
                                continue;
                            }
                        }
                        const xmlDoc = new DOMParser().parseFromString(text, "text/xml");
                        const entries = Array.from(xmlDoc.getElementsByTagName('entry'));
                        parseEntries(entries, allItems);
                    }
                }

                const uniqueItems = Array.from(new Map(allItems.map(item => [item.link, item])).values());
                allFetchedEntries = uniqueItems; 

                const tempGroups = {};
                uniqueItems.forEach(item => {
                    const key = getGroupKey(item);
                    if (!tempGroups[key]) {
                        tempGroups[key] = {
                            key: key,
                            displayTitle: item.displayTitle, 
                            updated: item.updated,
                            author: item.author,
                            links: [] 
                        };
                    }
                    tempGroups[key].links.push({
                        url: item.link,
                        code: item.code
                    });

                    tempGroups[key].displayTitle = item.displayTitle;
                    tempGroups[key].code = item.code;
                    tempGroups[key].link = item.link;
                });

                const latestGroups = {};
                Object.values(tempGroups).forEach(groupItem => {
                    if (!groupItem.link) {
                        groupItem.link = groupItem.links[0].url;
                        groupItem.code = groupItem.links[0].code;
                    }

                    const normTitle = getNormalizedTitle(groupItem.displayTitle);
                    const dedupKey = `${groupItem.author}_${normTitle}`;

                    if (!latestGroups[dedupKey]) {
                        latestGroups[dedupKey] = groupItem;
                    } else {
                        if (groupItem.updated > latestGroups[dedupKey].updated) {
                            latestGroups[dedupKey] = groupItem;
                        }
                    }
                });

                // 最新順にソート
                const sortedList = Object.values(latestGroups).sort((a, b) => b.updated - a.updated);

                renderList(sortedList);
                document.getElementById('lastUpdate').innerText = `UPDATED: ${new Date().toLocaleTimeString('ja-JP')}`;
            } catch (error) {
                console.error(error);
                document.getElementById('entryList').innerHTML = `<p class="py-20 text-center text-slate-400 dark:text-slate-600 text-xs">データの取得に失敗しました。時間をおいてもう一度お試しください。</p>`;
            }
        }

        // 指定河川洪水予報「VPCC」・土砂災害警戒情報「VXKOii (ii=50-89)」を厳密にパース
        function parseEntries(entries, targetList) {
            for (let entry of entries) {
                const link = entry.querySelector('link[type="application/xml"]')?.getAttribute('href') || entry.getElementsByTagName('link')[0]?.getAttribute('href');
                if (!link) continue;
                const code = (link.match(/_(V[A-Z0-9]+)_/) || [])[1] || "";
                
                // VPCC(指定河川洪水予報) であるかの判定
                const isFlood = code.startsWith('VPCC');
                
                // VXKOii (ii=50-89) であるかの判定
                const isLandslide = code.startsWith('VXKO') && (function() {
                    const numPart = code.substring(4);
                    const num = parseInt(numPart, 10);
                    return !isNaN(num) && num >= 50 && num <= 89;
                })();

                if (!isFlood && !isLandslide) continue;

                let displayTitle = extractFullTitle(entry);
                const author = entry.getElementsByTagName('author')[0]?.getElementsByTagName('name')[0]?.textContent || "気象庁";
                const updated = new Date(entry.getElementsByTagName('updated')[0]?.textContent);
                const content = entry.getElementsByTagName('content')[0]?.textContent || "";

                targetList.push({
                    updated, author, link, code, displayTitle, content
                });
            }
        }

        // 単一フィードとしてのすっきりとした一覧表示
        function renderList(list) {
            const container = document.getElementById('entryList');
            container.innerHTML = "";

            const header = document.createElement('div');
            header.className = "category-header px-4 py-2 border-b border-slate-100/50 dark:border-slate-900/50 bg-white/95 dark:bg-slate-950/95";
            header.innerHTML = `<span class="text-[8px] font-black text-slate-400 dark:text-slate-500 uppercase tracking-[0.2em]">現在発表中の洪水・土砂災害警戒情報</span>`;
            container.appendChild(header);

            if (list.length === 0) {
                const empty = document.createElement('div');
                empty.className = "px-4 py-16 text-center";
                empty.innerHTML = `<p class="text-[10px] font-bold text-slate-300 dark:text-slate-700 uppercase tracking-widest italic">現在、発表されている情報はありません</p>`;
                container.appendChild(empty);
            } else {
                list.forEach(item => {
                    const btn = document.createElement('button');
                    btn.className = "entry-card w-full text-left px-4 py-5 outline-none border-b border-slate-100 dark:border-slate-900 hover:bg-slate-50 dark:hover:bg-slate-900/50 transition-colors";
                    
                    const isFlood = item.code.startsWith('VPCC');
                    const badgeText = isFlood ? "洪水予報" : "土砂災害警戒";
                    const badgeClass = isFlood 
                        ? "bg-red-50 dark:bg-red-950/40 text-red-600 dark:text-red-400"
                        : "bg-purple-50 dark:bg-purple-950/40 text-purple-600 dark:text-purple-400";
                    
                    btn.innerHTML = `
                        <div class="space-y-2">
                            <div class="flex items-center flex-wrap gap-2">
                                <span class="px-1.5 py-0.5 ${badgeClass} font-black rounded text-[8px] tracking-wider uppercase">${badgeText}</span>
                                <h3 class="text-[11px] md:text-xs font-bold text-slate-700 dark:text-slate-300 leading-tight">${item.displayTitle}</h3>
                            </div>
                            <div class="flex items-center gap-2 text-[8px] font-bold text-slate-400 dark:text-slate-600">
                                <span class="tabular-nums">${formatToReiwa(item.updated)}</span>
                                <span>|</span>
                                <span>${item.author}</span>
                            </div>
                        </div>
                    `;
                    btn.onclick = () => fetchDetail(item);
                    container.appendChild(btn);
                });
            }
            lucide.createIcons();
        }

        // 詳細情報の取得・解析表示
        async function fetchDetail(item) {
            const area = document.getElementById('contentArea');
            area.classList.remove('hidden');
            setTimeout(() => area.classList.remove('opacity-0', 'translate-y-4'), 10);
            document.body.style.overflow = 'hidden';
            
            const container = document.getElementById('detailContainer');
            container.innerHTML = `
                <div class="py-40 text-center w-full">
                    <div class="inline-block h-4 w-4 border-2 border-slate-100 dark:border-slate-900 border-t-blue-500 rounded-full animate-spin"></div>
                </div>`;

            try {
                const linksToFetch = item.links || [{ url: item.link, code: item.code }];
                
                const fetchResults = await Promise.allSettled(linksToFetch.map(async (l) => {
                    let rawXmlText = "";
                    if (isDemoMode && MOCK_DATA.telegrams[l.url]) {
                        rawXmlText = MOCK_DATA.telegrams[l.url];
                    } else {
                        try {
                            const res = await fetch(l.url);
                            rawXmlText = await res.text();
                        } catch (err) {
                            const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(l.url)}`;
                            const res = await fetch(proxyUrl);
                            rawXmlText = await res.text();
                        }
                    }
                    const doc = getXmlDocFromString(rawXmlText);
                    return { code: l.code, rawXmlText, doc };
                }));

                let headline = "";
                let bodyText = "";
                
                // 高度な詳細情報の抽出用オブジェクト
                let stationsData = {}; // 観測所ごとの予測水位や基準しきい値を格納
                let rainInfos = [];    // 雨量情報の格納
                let inundationRegions = {}; // 浸水想定地区の格納

                fetchResults.forEach(result => {
                    if (result.status !== 'fulfilled') return;

                    const { code, doc } = result.value;

                    if (!headline) {
                        headline = doc.getElementsByTagName('Headline')[0]?.getElementsByTagName('Text')[0]?.textContent || "";
                    }

                    const bodyPart = doc.getElementsByTagName('Body')[0];
                    if (!bodyPart) return;

                    // 1. 各水位観測所の基準水位(Criteria)のパース
                    const stationParts = doc.getElementsByTagName('HydrometricStationPart');
                    for (let sp of stationParts) {
                        const stName = sp.getElementsByTagName('Area')[0]?.getElementsByTagName('Name')[0]?.textContent;
                        if (stName) {
                            if (!stationsData[stName]) stationsData[stName] = {};
                            stationsData[stName].chargeSection = sp.getElementsByTagName('ChargeSection')[0]?.textContent || "";
                            
                            const criteria = {};
                            const wlNodes = sp.getElementsByTagName('Criteria')[0]?.getElementsByTagName('WaterLevel') || [];
                            for (let node of wlNodes) {
                                const typeAttr = node.getAttribute('type') || "";
                                const val = parseFloat(node.textContent);
                                if (!isNaN(val)) {
                                    criteria[typeAttr] = val;
                                }
                            }
                            stationsData[stName].criteria = criteria;
                        }
                    }

                    // 2. 水位時系列推移データ(TimeSeriesInfo)のパース
                    const timeSeriesNodes = doc.getElementsByTagName('TimeSeriesInfo');
                    for (let ts of timeSeriesNodes) {
                        const timeDefines = ts.getElementsByTagName('TimeDefines')[0]?.getElementsByTagName('TimeDefine') || [];
                        const timeMap = {};
                        for (let td of timeDefines) {
                            const tId = td.getAttribute('timeId');
                            const tName = td.getElementsByTagName('Name')[0]?.textContent || "";
                            timeMap[tId] = tName;
                        }

                        const items = ts.getElementsByTagName('Item');
                        for (let it of items) {
                            const kindName = it.getElementsByTagName('Name')[0]?.textContent;
                            if (kindName === '水位') {
                                const stName = it.getElementsByTagName('Station')[0]?.getElementsByTagName('Name')[0]?.textContent;
                                if (stName) {
                                    if (!stationsData[stName]) stationsData[stName] = {};
                                    
                                    const wlPart = it.getElementsByTagName('WaterLevelPart')[0]?.getElementsByTagName('WaterLevel') || [];
                                    const timeSeriesList = [];
                                    
                                    // 時系列の値をrefIDをベースに整理
                                    const valuesByRef = {};
                                    for (let wl of wlPart) {
                                        const refId = wl.getAttribute('refID');
                                        const typeAttr = wl.getAttribute('type');
                                        if (!valuesByRef[refId]) valuesByRef[refId] = {};
                                        
                                        if (typeAttr === '水位') {
                                            valuesByRef[refId].value = wl.textContent;
                                        } else if (typeAttr === 'レベル') {
                                            valuesByRef[refId].level = wl.textContent;
                                        }
                                    }

                                    // timeMap と紐付けて時系列リストを生成
                                    Object.keys(valuesByRef).forEach(refId => {
                                        const tName = timeMap[refId] || `時間ID:${refId}`;
                                        timeSeriesList.push({
                                            timeName: tName,
                                            value: valuesByRef[refId].value || "欠測",
                                            level: valuesByRef[refId].level || null
                                        });
                                    });

                                    stationsData[stName].timeSeries = timeSeriesList;
                                }
                            }
                        }
                    }

                    // 3. 浸水想定地区の抽出
                    const warningItems = doc.getElementsByTagName('Warning')[0]?.getElementsByTagName('Item') || [];
                    for (let wItem of warningItems) {
                        const wName = wItem.getElementsByTagName('Name')[0]?.textContent || "";
                        if (wName === '浸水想定地区') {
                            const areas = wItem.getElementsByTagName('Areas')[0]?.getElementsByTagName('Area') || [];
                            for (let area of areas) {
                                const stRef = area.getElementsByTagName('Name')[0]?.textContent;
                                const subCities = area.getElementsByTagName('SubCityList')[0]?.textContent;
                                if (stRef && subCities) {
                                    inundationRegions[stRef] = subCities;
                                }
                            }
                        }
                    }

                    // 4. 雨量情報の抽出
                    const rainTimeSeries = doc.getElementsByTagName('MeteorologicalInfos');
                    for (let rInfo of rainTimeSeries) {
                        if (rInfo.getAttribute('type') === '雨量情報') {
                            const tsInfos = rInfo.getElementsByTagName('TimeSeriesInfo');
                            for (let ts of tsInfos) {
                                const areaName = ts.getElementsByTagName('Area')[0]?.getElementsByTagName('Name')[0]?.textContent || "流域";
                                const timeDefines = ts.getElementsByTagName('TimeDefines')[0]?.getElementsByTagName('TimeDefine') || [];
                                const tMap = {};
                                for (let td of timeDefines) {
                                    const tId = td.getAttribute('timeId');
                                    tMap[tId] = td.getElementsByTagName('Name')[0]?.textContent || "";
                                }

                                const precPart = ts.getElementsByTagName('PrecipitationPart')[0]?.getElementsByTagName('Precipitation') || [];
                                const rainList = [];
                                for (let pr of precPart) {
                                    const refId = pr.getAttribute('refID');
                                    const unit = pr.getAttribute('unit') || "mm";
                                    rainList.push({
                                        title: tMap[refId] || "雨量情報",
                                        value: pr.textContent,
                                        unit: unit
                                    });
                                }
                                rainInfos.push({ area: areaName, data: rainList });
                            }
                        }
                    }

                    // 5. 汎用テキスト本文
                    const commentTags = bodyPart.getElementsByTagName('Comment');
                    if (!bodyText || (commentTags && commentTags.length > 0)) {
                        let text = "";
                        if (commentTags && commentTags.length > 0) {
                            const texts = commentTags[0].getElementsByTagName('Text');
                            for (let t of texts) { 
                                if (t.getAttribute('type') === '本文' || !text) text = t.textContent; 
                            }
                        }
                        if (!text) {
                            text = bodyPart.getElementsByTagName('Text')[0]?.textContent || "";
                        }
                        if (text && text.trim() !== "") {
                            bodyText = text;
                        }
                    }
                });

                // --- 構造化された水位/雨量ビューの構築 ---
                let structuredDetailsHtml = "";

                // 各観測所の詳細情報をレンダリング
                const stationNames = Object.keys(stationsData);
                if (stationNames.length > 0) {
                    structuredDetailsHtml += `
                        <div class="space-y-8 mt-10">
                            <h3 class="text-xs font-black text-slate-400 dark:text-slate-500 uppercase tracking-[0.2em] border-b border-slate-100 dark:border-slate-800 pb-3">観測所別の詳細な現況と見込み</h3>
                    `;

                    stationNames.forEach(stName => {
                        const data = stationsData[stName];
                        const criteria = data.criteria || {};
                        const timeSeries = data.timeSeries || [];
                        const inundation = inundationRegions[stName] || "情報なし";

                        // 現在の現況水位の取得
                        const currentItem = timeSeries.find(t => t.timeName === '現況') || timeSeries[0];
                        const currentVal = currentItem ? parseFloat(currentItem.value) : null;
                        const currentLvl = currentItem ? currentItem.level : null;

                        // 基準しきい値
                        const l1 = criteria['レベル１水防団待機水位'] || criteria['レベル1水防団待機水位'];
                        const l2 = criteria['レベル２氾濫注意水位'] || criteria['レベル2氾濫注意水位'];
                        const l3 = criteria['レベル３避難判断水位'] || criteria['レベル3避難判断水位'];
                        const l4 = criteria['レベル４氾濫危険水位'] || criteria['レベル4氾濫危険水位'];
                        const lMax = criteria['レベル４計画高水位等'] || criteria['レベル4計画高水位等'];

                        // 水位に応じたカラー決定（バッジ用）
                        let levelColor = "bg-slate-100 text-slate-700 dark:bg-slate-900 dark:text-slate-300";
                        if (currentLvl === "1") levelColor = "bg-blue-500 text-white";
                        if (currentLvl === "2") levelColor = "bg-yellow-500 text-slate-950";
                        if (currentLvl === "3") levelColor = "bg-red-500 text-white";
                        if (currentLvl === "4" || currentLvl === "5") levelColor = "bg-purple-600 text-white";

                        // インジケーター用の現況比率計算
                        let progressPercent = 0;
                        if (currentVal && lMax) {
                            progressPercent = Math.min(100, Math.max(5, (currentVal / lMax) * 100));
                        }

                        structuredDetailsHtml += `
                            <div class="bg-slate-50 dark:bg-slate-900/40 rounded-2xl p-5 md:p-8 border border-slate-100/80 dark:border-slate-900 space-y-6">
                                <header class="flex items-center justify-between flex-wrap gap-4">
                                    <div class="space-y-1">
                                        <div class="flex items-center gap-3">
                                            <h4 class="text-lg md:text-xl font-bold text-slate-800 dark:text-slate-100">${stName} 観測所</h4>
                                            ${currentLvl ? `<span class="px-2.5 py-0.5 rounded text-[10px] font-black ${levelColor}">警戒レベル ${currentLvl}相当</span>` : ''}
                                        </div>
                                        <p class="text-[10px] text-slate-400 dark:text-slate-500">${data.chargeSection || ''}</p>
                                    </div>
                                    <div class="text-right">
                                        <p class="text-[10px] text-slate-400 dark:text-slate-500 font-bold uppercase tracking-wider">現況の水位</p>
                                        <p class="text-2xl md:text-3xl font-black text-slate-800 dark:text-slate-100 tabular-nums">${currentVal !== null ? `${currentVal.toFixed(2)} <span class="text-sm">m</span>` : '欠測'}</p>
                                    </div>
                                </header>

                                <!-- 水位状況インジケーター（簡易ビジュアルバー） -->
                                <div class="space-y-2 pt-2">
                                    <div class="flex items-center justify-between text-[9px] font-bold text-slate-400">
                                        <span>危険度メーター</span>
                                        <span>計画高水位: ${lMax ? `${lMax.toFixed(2)}m` : 'データなし'}</span>
                                    </div>
                                    <div class="relative w-full h-4 bg-slate-200 dark:bg-slate-800 rounded-full overflow-hidden">
                                        <!-- 現況水位のバー -->
                                        <div class="h-full rounded-full transition-all duration-500 ${currentLvl === '4' ? 'bg-purple-600' : currentLvl === '3' ? 'bg-red-500' : currentLvl === '2' ? 'bg-yellow-500' : 'bg-blue-500'}" style="width: ${progressPercent}%"></div>
                                        
                                        <!-- 基準水位ラインのプロット（バー上の縦線しきい値） -->
                                        ${l1 && lMax ? `<div class="absolute top-0 bottom-0 border-l border-blue-400" style="left: ${(l1/lMax)*100}%" title="待機水位: ${l1}m"></div>` : ''}
                                        ${l2 && lMax ? `<div class="absolute top-0 bottom-0 border-l border-yellow-400" style="left: ${(l2/lMax)*100}%" title="注意水位: ${l2}m"></div>` : ''}
                                        ${l3 && lMax ? `<div class="absolute top-0 bottom-0 border-l border-red-400" style="left: ${(l3/lMax)*100}%" title="避難判断水位: ${l3}m"></div>` : ''}
                                        ${l4 && lMax ? `<div class="absolute top-0 bottom-0 border-l border-purple-400" style="left: ${(l4/lMax)*100}%" title="氾濫危険水位: ${l4}m"></div>` : ''}
                                    </div>
                                    <!-- 各しきい値の数値ラベル -->
                                    <div class="grid grid-cols-2 md:grid-cols-4 gap-2 text-[10px] font-bold text-slate-500 dark:text-slate-400 pt-1">
                                        ${l4 ? `<div class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 bg-purple-500 rounded-sm"></span> 氾濫危険: ${l4.toFixed(2)}m</div>` : ''}
                                        ${l3 ? `<div class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 bg-red-500 rounded-sm"></span> 避難判断: ${l3.toFixed(2)}m</div>` : ''}
                                        ${l2 ? `<div class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 bg-yellow-500 rounded-sm"></span> 氾濫注意: ${l2.toFixed(2)}m</div>` : ''}
                                        ${l1 ? `<div class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 bg-blue-500 rounded-sm"></span> 待機水位: ${l1.toFixed(2)}m</div>` : ''}
                                    </div>
                                </div>

                                <!-- 浸水想定地区 -->
                                <div class="p-4 bg-white dark:bg-slate-900 rounded-xl border border-slate-100 dark:border-slate-800/80 space-y-1">
                                    <div class="flex items-center gap-1.5 text-slate-400 dark:text-slate-500 text-[10px] font-bold tracking-wider">
                                        <i data-lucide="map-pin" class="w-3.5 h-3.5 text-red-500"></i>
                                        <span>氾濫による浸水想定地区</span>
                                    </div>
                                    <p class="text-xs md:text-sm font-bold text-slate-700 dark:text-slate-300">${inundation}</p>
                                </div>

                                <!-- 時系列予測推移テーブル -->
                                ${timeSeries.length > 0 ? `
                                    <div class="space-y-2">
                                        <p class="text-[10px] text-slate-400 dark:text-slate-500 font-bold uppercase tracking-wider">予測水位・警戒レベル推移</p>
                                        <div class="overflow-x-auto custom-scrollbar border border-slate-100 dark:border-slate-800 rounded-xl">
                                            <table class="min-w-full divide-y divide-slate-100 dark:divide-slate-800 text-[11px]">
                                                <thead class="bg-slate-100/50 dark:bg-slate-900/50 font-bold text-slate-500 dark:text-slate-400 text-left">
                                                    <tr>
                                                        <th class="px-4 py-2.5 whitespace-nowrap">予測時刻</th>
                                                        <th class="px-4 py-2.5 whitespace-nowrap">予想水位</th>
                                                        <th class="px-4 py-2.5 whitespace-nowrap">警戒レベル</th>
                                                    </tr>
                                                </thead>
                                                <tbody class="divide-y divide-slate-100 dark:divide-slate-800 text-slate-600 dark:text-slate-300 tabular-nums">
                                                    ${timeSeries.map(tsItem => {
                                                        const isNow = tsItem.timeName === '現況';
                                                        let levelBadge = '';
                                                        if (tsItem.level) {
                                                            let lvlColor = "bg-slate-100 text-slate-700 dark:bg-slate-800 dark:text-slate-300";
                                                            if (tsItem.level === "1") lvlColor = "bg-blue-100 text-blue-800 dark:bg-blue-950/40 dark:text-blue-400";
                                                            if (tsItem.level === "2") lvlColor = "bg-yellow-100 text-yellow-800 dark:bg-yellow-950/40 dark:text-yellow-400";
                                                            if (tsItem.level === "3") lvlColor = "bg-red-100 text-red-800 dark:bg-red-950/40 dark:text-red-400";
                                                            if (tsItem.level === "4") lvlColor = "bg-purple-100 text-purple-800 dark:bg-purple-950/40 dark:text-purple-400";
                                                            levelBadge = `<span class="px-1.5 py-0.5 rounded text-[9px] font-black ${lvlColor}">レベル ${tsItem.level}相当</span>`;
                                                        }
                                                        
                                                        return `
                                                            <tr class="${isNow ? 'bg-blue-50/30 dark:bg-blue-950/10 font-bold text-slate-900 dark:text-white' : ''}">
                                                                <td class="px-4 py-2.5 whitespace-nowrap">${tsItem.timeName} ${isNow ? '（発表）' : ''}</td>
                                                                <td class="px-4 py-2.5 whitespace-nowrap">${tsItem.value !== '欠測' && !isNaN(parseFloat(tsItem.value)) ? `${parseFloat(tsItem.value).toFixed(2)} m` : tsItem.value}</td>
                                                                <td class="px-4 py-2.5 whitespace-nowrap">${levelBadge || '-'}</td>
                                                            </tr>
                                                        `;
                                                    }).join('')}
                                                </tbody>
                                            </table>
                                        </div>
                                    </div>
                                ` : ''}
                            </div>
                        `;
                    });
                    structuredDetailsHtml += `</div>`;
                }

                // 流域平均雨量ビューの構築
                if (rainInfos.length > 0) {
                    structuredDetailsHtml += `
                        <div class="space-y-6 mt-10">
                            <h3 class="text-xs font-black text-slate-400 dark:text-slate-500 uppercase tracking-[0.2em] border-b border-slate-100 dark:border-slate-800 pb-3">流域平均雨量</h3>
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    `;
                    rainInfos.forEach(rain => {
                        structuredDetailsHtml += `
                            <div class="bg-slate-50 dark:bg-slate-900/40 rounded-2xl p-5 border border-slate-100/80 dark:border-slate-900 space-y-4">
                                <h4 class="text-xs font-black text-slate-700 dark:text-slate-300 flex items-center gap-1.5">
                                    <i data-lucide="cloud-rain" class="w-4 h-4 text-blue-500"></i>
                                    <span>${rain.area}</span>
                                </h4>
                                <div class="divide-y divide-slate-100 dark:divide-slate-800">
                                    ${rain.data.map(d => `
                                        <div class="flex items-center justify-between py-2 text-xs">
                                            <span class="text-slate-500 dark:text-slate-400 font-medium">${d.title}</span>
                                            <span class="font-black text-slate-800 dark:text-slate-200 tabular-nums">${d.value} <span class="text-[10px] text-slate-400">${d.unit}</span></span>
                                        </div>
                                    `).join('')}
                                </div>
                            </div>
                        `;
                    });
                    structuredDetailsHtml += `</div></div>`;
                }

                const isFlood = item.code.startsWith('VPCC');
                const badgeText = isFlood ? "洪水予報" : "土砂災害警戒";
                const badgeClass = isFlood 
                    ? "bg-red-500 text-white" 
                    : "bg-purple-500 text-white";

                container.innerHTML = `
                    <div class="fade-in space-y-10 w-full">
                        <header class="space-y-4 pb-8 text-left border-b border-slate-100 dark:border-slate-800 w-full">
                            <div class="flex items-center gap-2">
                                <span class="px-2 py-0.5 ${badgeClass} font-black rounded text-[9px] tracking-widest uppercase">${badgeText}</span>
                            </div>
                            <h2 class="text-2xl md:text-3xl font-black text-slate-800 dark:text-slate-100 leading-tight">${item.displayTitle}</h2>
                            <div class="flex items-center gap-3 text-xs md:text-sm font-bold text-slate-400 dark:text-slate-500">
                                <span class="flex items-center gap-1"><i data-lucide="building" class="w-4 h-4"></i> ${item.author}</span>
                                <span>/</span>
                                <span>${formatToReiwa(item.updated)} 発表</span>
                            </div>
                        </header>
                        ${headline ? `<div class="p-6 md:p-8 bg-slate-50 dark:bg-slate-900 rounded-2xl border border-slate-100/50 dark:border-slate-800 shadow-sm"><p class="text-slate-700 dark:text-slate-200 font-bold leading-relaxed whitespace-pre-wrap text-sm md:text-base">${headline}</p></div>` : ''}
                        
                        <!-- 動的構造化ビュー -->
                        ${structuredDetailsHtml}

                        ${bodyText ? `<article class="text-left weather-text text-slate-600 dark:text-slate-300 text-base md:text-lg whitespace-pre-wrap mt-8">${bodyText}</article>` : ''}
                    </div>`;
                lucide.createIcons();
            } catch (e) {
                console.error(e);
                container.innerHTML = `<p class="text-center py-20 text-slate-400 dark:text-slate-500 text-sm font-bold">読み込みに失敗しました。</p>`;
            }
        }

        function escapeHtml(unsafe) {
            return unsafe.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        function closeDetail() {
            const area = document.getElementById('contentArea');
            area.classList.add('opacity-0', 'translate-y-4');
            setTimeout(() => { 
                area.classList.add('hidden'); 
                document.body.style.overflow = 'auto'; 
            }, 200);
        }

        // システムダークモード対応
        function initDarkMode() {
            if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
        }

        // キーボードショートカット
        document.addEventListener('keydown', (e) => {
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

            if (e.key === 'Escape') {
                const detailArea = document.getElementById('contentArea');
                if (!detailArea.classList.contains('hidden')) {
                    closeDetail();
                }
            }
        });
    </script>
</body>
</html>
